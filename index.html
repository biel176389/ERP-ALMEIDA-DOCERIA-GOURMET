    function escolherEtiquetaBip(codigo) {
      fecharModalDirect();
      processarBipagemCodigo(codigo);
    }

    // ---------- Conferência: estoque do sistema x etiquetas disponíveis (admin) ----------
    function bipDivergencias() {
      return (DB.produtos || []).map(p => {
        const disp = (DB.producoes || []).filter(pr => pr.produtoId === p.id)
          .reduce((t, pr) => t + (pr.itens || []).filter(bipItemDisponivel).length, 0);
        const est = Math.max(0, Number(p.estoque) || 0);
        return { produto: p, disp, est, diff: disp - est };
      }).filter(x => x.diff !== 0);
    }

    function bipConferenciaCard() {
      if (window.currentUserRole !== 'admin') return '';
      const div = bipDivergencias();
      if (!div.length) return '';
      const linhas = div.map(x => x.diff > 0
        ? `<tr><td>${esc(x.produto.nome)}</td><td>${x.est}</td><td>${x.disp}</td><td><b>${x.diff}</b> etiqueta(s) a mais</td><td style="text-align:right;"><button class="btn btn-gold btn-sm" onclick="abrirAjusteEtiquetas('${esc(x.produto.id)}')">Conferir etiquetas</button></td></tr>`
        : `<tr><td>${esc(x.produto.nome)}</td><td>${x.est}</td><td>${x.disp}</td><td><b>${-x.diff}</b> unidade(s) sem etiqueta</td><td style="text-align:right;"><span class="hint">Gere etiquetas na Produção</span></td></tr>`
      ).join('');
      return `<div class="divider"></div>
        <div style="text-align:left;">
          <h3 style="margin-bottom:4px;">Conferência de estoque</h3>
          <p class="hint">O estoque do sistema e as etiquetas disponíveis deveriam ser iguais. Corrija as diferenças abaixo.</p>
          <div class="table-wrap"><table><thead><tr><th>Produto</th><th>Estoque</th><th>Etiquetas disponíveis</th><th>Diferença</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>
        </div>`;
    }

    function bipEtiquetasOrdenadas(produtoId) {
      const out = [];
      (DB.producoes || []).filter(pr => pr.produtoId === produtoId)
        .slice().sort((a, b) => String(a.dataValidade || '').localeCompare(String(b.dataValidade || '')))
        .forEach(pr => (pr.itens || []).filter(bipItemDisponivel).forEach(it => out.push({ it, pr })));
      return out;
    }

    function abrirAjusteEtiquetas(produtoId) {
      const x = bipDivergencias().find(d => d.produto.id === produtoId && d.diff > 0);
      if (!x) return toast('Não há diferença a conferir para este produto.', 'err');
      const lista = bipEtiquetasOrdenadas(produtoId);
      const linhas = lista.map((e, i) => `<label style="display:flex;gap:8px;align-items:center;padding:5px 2px;text-transform:none;cursor:pointer;margin:0;">
          <input type="checkbox" class="chk-ajuste" value="${esc(e.it.codigo)}" ${i < x.diff ? 'checked' : ''} onchange="contarAjusteEtiquetas(${x.diff})" style="width:18px;height:18px;accent-color:var(--wine,#7a1f3d);">
          <span class="mono">${esc(e.it.codigo)}</span><span class="hint">Lote ${esc(e.pr.lote || '—')} · val. ${fmtDate(e.pr.dataValidade)}</span></label>`).join('');
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal" style="max-width:520px;">
            <div class="modal-head"><h3>Conferir etiquetas — ${esc(x.produto.nome)}</h3><button class="modal-close" onclick="fecharModalDirect()">×</button></div>
            <div class="modal-body">
              <p class="hint">O sistema tem <b>${x.est}</b> unidade(s) em estoque, mas <b>${x.disp}</b> etiquetas disponíveis. Marque as <b>${x.diff}</b> etiqueta(s) que já não existem fisicamente; as desmarcadas continuam disponíveis. Nenhuma venda é criada e o estoque não muda.</p>
              <p style="margin:8px 0;"><b id="ajusteContador">${Math.min(x.diff, lista.length)} de ${x.diff}</b> selecionada(s)</p>
              <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px;">${linhas}</div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="confirmarAjusteEtiquetas('${esc(produtoId)}')">Dar baixa nas marcadas</button>
            </div>
          </div>
        </div>`;
    }

    function contarAjusteEtiquetas(alvo) {
      const n = document.querySelectorAll('.chk-ajuste:checked').length;
      const el = document.getElementById('ajusteContador');
      if (el) el.textContent = n + ' de ' + alvo;
    }

    function confirmarAjusteEtiquetas(produtoId) {
      if (window.currentUserRole !== 'admin') return toast('Somente o administrador pode ajustar etiquetas.', 'err');
      const x = bipDivergencias().find(d => d.produto.id === produtoId && d.diff > 0);
      if (!x) { fecharModalDirect(); return; }
      const marcadas = [...document.querySelectorAll('.chk-ajuste:checked')].map(c => c.value);
      if (marcadas.length !== x.diff) return toast('Marque exatamente ' + x.diff + ' etiqueta(s).', 'err');
      marcadas.forEach(c => { const a = findItemByCode(c); if (a && a.item && bipItemDisponivel(a.item)) a.item.status = 'ajuste'; });
      persist('producoes');
      fecharModalDirect();
      atualizarBipagemUI();
      toast(marcadas.length + ' etiqueta(s) baixada(s) por ajuste de estoque.', 'ok');
    }

    function renderBipagemLogRows() {
      const itens = (DB.scanlog || []).slice(-15).reverse();
      if (!itens.length) return '<tr><td colspan="3" class="empty">Nenhuma bipagem registrada ainda.</td></tr>';
      return itens.map(l => {
        const badgeClass = l.tipo === 'perda' ? 'badge-danger' : (l.tipo === 'doacao' ? 'badge-warn' : 'badge-ok');
        return `
          <tr>
            <td class="mono">${fmtDateTime(l.data)}</td>
            <td class="mono">${esc(l.codigo)}</td>
            <td><span class="badge ${badgeClass}">${esc(l.tipoLabel || TIPO_BIP_LABELS[l.tipo] || l.tipo)}</span></td>
          </tr>
        `;
      }).join('');
    }

    function atualizarBipagemUI() {
      const tbody = document.getElementById('bipagemLogBody');
      if (tbody) tbody.innerHTML = renderBipagemLogRows();
      const conf = document.getElementById('bipConferencia');
      if (conf) conf.innerHTML = bipConferenciaCard();
    }

    let bipagemPendente = null;

    // Calcula a comissão aplicável à venda de acordo com quem está logado:
    // Administrador bipando/vendendo não sofre desconto de comissão (o valor
    // integral entra como faturamento da loja); Vendedor sempre usa o % de
    // comissão configurado no seu perfil (padrão 20%).
    function comissaoAplicavel() {
      return (window.currentUserRole === 'admin') ? 0 : Number(window.currentUserComissao ?? 20);
    }

    // Busca o item pelo código e abre o modal de confirmação, sem registrar
    // nada ainda — a baixa só acontece quando o usuário confirma no modal.
    function processarBipagemCodigo(codigoBruto) {
      const codigo = (codigoBruto || '').trim();
      if (!codigo) return;

      if (bipagemPendente) {
        toast('Finalize a confirmação da bipagem anterior antes de escanear outra.', 'err');
        return;
      }

      const achado = findItemByCode(codigo);
      if (!achado) { toast('Código não encontrado: ' + codigo, 'err'); return; }
      const { producao, item } = achado;
      if (item.status && item.status !== 'disponivel') {
        toast('Este item já foi baixado anteriormente!', 'err');
        return;
      }
      const produto = findProduto(producao.produtoId);
      if (!produto) { toast('Produto não encontrado para este item', 'err'); return; }

      bipagemPendente = { codigo, produto, producao, item, tipo: BIPAGEM_TIPO };
      abrirModalConfirmacaoBipagem();
    }

    function abrirModalConfirmacaoBipagem() {
      const p = bipagemPendente;
      if (!p) return;
      const tipoLabel = TIPO_BIP_LABELS[p.tipo] || p.tipo;
      const infoComissao = p.tipo === 'venda'
        ? (window.currentUserRole === 'admin'
            ? '<p class="hint" style="margin-top:10px;">Registrada como venda direta do Administrador — sem desconto de comissão.</p>'
            : `<p class="hint" style="margin-top:10px;">Será somada ao seu extrato de comissões (${comissaoAplicavel()}% de comissão sobre o valor).</p>`)
        : '';
      const content = `
        <div class="modal-backdrop" onclick="if(event.target.classList.contains('modal-backdrop')) cancelarBipagemPendente();">
          <div class="modal" style="max-width:420px;">
            <div class="modal-head">
              <h3>Confirmar Bipagem</h3>
              <button class="modal-close" onclick="cancelarBipagemPendente()">×</button>
            </div>
            <div class="modal-body">
              <div style="text-align:center;margin-bottom:16px;">
                <div style="font-family:'Fraunces',serif;font-size:20px;font-weight:600;">${esc(p.produto.nome)}</div>
                <div class="mono" style="color:var(--muted);font-size:12.5px;margin-top:3px;">${esc(p.codigo)}</div>
              </div>
              <div class="field-row">
                <div class="field"><label>Lote</label><div class="mono">${esc(p.producao.lote || '—')}</div></div>
                <div class="field"><label>Validade</label><div class="mono">${fmtDate(p.producao.dataValidade)}</div></div>
              </div>
              <div class="field-row">
                <div class="field">
                  <label>Preço (R$)${p.produto.preco !== undefined ? ` <span class="mono" style="font-weight:400;color:var(--muted);">padrão ${fmtMoney(p.produto.preco)}</span>` : ''}</label>
                  <input type="number" id="bipPrecoAjustado" class="input" min="0" step="0.01" value="${Number(p.produto.preco).toFixed(2)}">
                </div>
                <div class="field"><label>Operação</label><div><span class="badge badge-muted">${esc(tipoLabel)}</span></div></div>
              </div>
              ${infoComissao}
              ${p.tipo === 'venda' ? '<p class="hint" style="margin-top:6px;">Alterar o preço aqui vale só para esta venda (ex.: desconto). O preço cadastrado do produto não muda.</p>' : ''}
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="cancelarBipagemPendente()">Cancelar</button>
              <button class="btn btn-primary" onclick="confirmarBipagemPendente()">Confirmar</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalRoot').innerHTML = content;
    }

    function cancelarBipagemPendente() {
      bipagemPendente = null;
      fecharModalDirect();
    }

    function confirmarBipagemPendente() {
      const p = bipagemPendente;
      if (!p) return;
      const { codigo, produto, item, tipo } = p;

      const precoInput = document.getElementById('bipPrecoAjustado');
      const precoVenda = precoInput ? (Number(precoInput.value.replace(',', '.'))) : Number(produto.preco);
      if (!Number.isFinite(precoVenda) || precoVenda <= 0) return toast('Informe um preço de venda maior que zero.', 'err');

      // revalida na hora de confirmar, caso o item tenha sido baixado por
      // outra aba/dispositivo entre o scan e a confirmação
      if (item.status && item.status !== 'disponivel') {
        toast('Este item já foi baixado enquanto o modal estava aberto!', 'err');
        bipagemPendente = null;
        fecharModalDirect();
        atualizarBipagemUI();
        return;
      }

      produto.estoque = Math.max(0, produto.estoque - 1);
      item.status = tipo === 'perda' ? 'perda' : (tipo === 'doacao' ? 'doado' : 'vendido');

      if (tipo === 'venda') {
        const vendaBipagem = {
          id: uid(),
          data: nowISO(),
          itens: [{ produtoId: produto.id, qty: 1, preco: precoVenda, custoUnitarioInsumos: window.custoInsumosPorUnidade ? window.custoInsumosPorUnidade(produto.id) : null }],
          origem: 'bipagem',
          codigo,
          localCanal: 'Bipagem / Campo',
          vendedorUid: window.currentFirebaseUser?.uid || '',
          vendedorEmail: window.currentFirebaseUser?.email || '',
          comissaoPorcentagem: comissaoAplicavel(),
          baixaPendente: window.currentUserRole === 'vendedor',
          statusAcerto: 'pendente'
        };
        DB.vendas.push(vendaBipagem);
        if (window.salvarVendaFirestore) window.salvarVendaFirestore(vendaBipagem);
      }

      DB.scanlog.push({
        id: uid(),
        data: nowISO(),
        codigo,
        produtoId: produto.id,
        tipo,
        tipoLabel: TIPO_BIP_LABELS[tipo] || tipo
      });

      persist('produtos', 'vendas', 'scanlog', 'producoes');
      atualizarBipagemUI();

      if (tipo === 'venda') toast(`Venda registrada: ${produto.nome} (${fmtMoney(precoVenda)})`, 'ok');
      else if (tipo === 'doacao') toast(`Doação registrada: ${produto.nome}`, 'ok');
      else toast(`Perda/Avaria registrada: ${produto.nome}`, 'err');

      bipagemPendente = null;
      fecharModalDirect();
    }

    function processarBip(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (!val) return;
        processarBipagemCodigo(val);
        e.target.value = '';
      }
    }

    function alternarScannerBipagem() {
      if (scannerBipAtivo) pararScannerBipagem();
      else iniciarScannerBipagem();
    }

    function iniciarScannerBipagem() {
      const readerEl = document.getElementById('cameraReader');
      const btn = document.getElementById('btnToggleScannerBip');
      if (!readerEl || typeof Html5Qrcode === 'undefined') {
        toast('Leitor de QR Code não disponível neste navegador', 'err');
        return;
      }
      try {
        html5QrScannerBip = new Html5Qrcode('cameraReader');
        html5QrScannerBip.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            const agora = Date.now();
            if (decodedText === ultimoScanCodigo && (agora - ultimoScanTempo) < 3000) return;
            ultimoScanCodigo = decodedText;
            ultimoScanTempo = agora;
            processarBipagemCodigo(decodedText);
          },
          () => {}
        ).then(() => {
          scannerBipAtivo = true;
          if (btn) btn.textContent = 'Desativar Câmera';
        }).catch((err) => {
          toast('Não foi possível acessar a câmera: ' + err, 'err');
        });
      } catch (err) {
        toast('Erro ao iniciar o leitor de QR Code', 'err');
      }
    }

    function pararScannerBipagem() {
      if (html5QrScannerBip) {
        html5QrScannerBip.stop().then(() => html5QrScannerBip.clear())
          .catch(() => {}).finally(() => {
            html5QrScannerBip = null;
            scannerBipAtivo = false;
            const btn = document.getElementById('btnToggleScannerBip');
            if (btn) btn.textContent = 'Ativar Câmera';
          });
      } else {
        scannerBipAtivo = false;
      }
    }

    function gerarQrDataUrl(texto) {
      try {
        const qr = qrcode(0, 'M');
        qr.addData(String(texto));
        qr.make();
        return qr.createDataURL(8, 2);
      } catch (e) {
        console.error('Erro ao gerar QR Code', e);
        return '';
      }
    }

    function renderLabelsSheetHtml() {
      const layout = DB.etiquetaLayout || defaultEtiquetaLayout();
      const producoesComItens = DB.producoes.filter(p => (p.itens || []).some(bipItemDisponivel)); // só lotes com etiqueta ainda em estoque
      const producaoSelId = window.ETQ_PRODUCAO_ID && producoesComItens.some(p => p.id === window.ETQ_PRODUCAO_ID)
        ? window.ETQ_PRODUCAO_ID
        : (producoesComItens[producoesComItens.length - 1]?.id || '');
      const prod = producoesComItens.find(p => p.id === producaoSelId);
      const p = prod ? findProduto(prod.produtoId) : null;
      const orientClass = layout.orientacao === 'vertical' ? 'orient-vertical' : 'orient-horizontal';
      const whats = layout.whatsapp || DB.config.whatsapp || '';
      const insta = layout.instagram || DB.config.instagram || '';

      if (!prod) return '<p class="empty">Nenhuma produção com estoque disponível para imprimir etiquetas.</p>';

      return (prod.itens || []).map((it, idx) => `
        <div class="label-card ${orientClass}" style="--etq-editor-bg:${esc(layout.fundo || '#ffffff')};--etq-editor-text:${esc(layout.corTexto || '#171717')};--etq-editor-border:${esc(layout.corBorda || '#171717')};--etq-editor-accent:${esc(layout.corDestaque || '#7a1f3d')};--etq-editor-radius:${Number(layout.raioBorda ?? 12)}px;--etq-editor-border-width:${Number(layout.espessuraBorda ?? 2)}px;--etq-editor-title-font:'${esc(layout.fonteTitulo || 'Fraunces')}';--etq-editor-body-font:'${esc(layout.fonteCorpo || 'Manrope')}';">
          <div class="label-header">
            <div class="label-name" data-etq-drag="titulo" style="transform:translate(${Number(layout.posicoes?.titulo?.x)||0}px,${Number(layout.posicoes?.titulo?.y)||0}px) scale(${Number(layout.tamanhos?.titulo)||1});transform-origin:top left">${esc(p ? p.nome : 'Produto')}</div>
            <div class="label-num" data-etq-drag="numero" style="transform:translate(${Number(layout.posicoes?.numero?.x)||0}px,${Number(layout.posicoes?.numero?.y)||0}px) scale(${Number(layout.tamanhos?.numero)||1});transform-origin:top right">N°${idx + 1}</div>
          </div>
          <div class="label-body">
            <div class="label-main">
              <div class="label-lote" style="${layout.mostrarLote === false ? 'display:none;' : ''}">
                <span data-etq-drag="lote" style="display:block;transform:translate(${Number(layout.posicoes?.lote?.x)||0}px,${Number(layout.posicoes?.lote?.y)||0}px) scale(${Number(layout.tamanhos?.lote)||1});transform-origin:top left">LOTE: <b>${esc(prod.lote || '')}</b></span>
                <span data-etq-drag="validade" style="display:block;transform:translate(${Number(layout.posicoes?.validade?.x)||0}px,${Number(layout.posicoes?.validade?.y)||0}px) scale(${Number(layout.tamanhos?.validade)||1});transform-origin:top left">VAL: <b>${fmtDate(prod.dataValidade)}</b></span>
              </div>
              <div class="label-contact-title" data-etq-drag="contato" style="${layout.mostrarContato === false || !layout.textoContatoTitulo ? 'display:none;' : ''}transform:translate(${Number(layout.posicoes?.contato?.x)||0}px,${Number(layout.posicoes?.contato?.y)||0}px) scale(${Number(layout.tamanhos?.contato)||1});transform-origin:top left;">${esc(layout.textoContatoTitulo || '')}</div>
              <div class="label-contact-line" data-etq-drag="whatsapp" style="${layout.mostrarWhatsApp === false ? 'display:none;' : ''}transform:translate(${Number(layout.posicoes?.whatsapp?.x)||0}px,${Number(layout.posicoes?.whatsapp?.y)||0}px) scale(${Number(layout.tamanhos?.whatsapp)||1});transform-origin:top left;"><span class="ico">📱</span> WhatsApp: ${esc(whats)}</div>
              <div class="label-contact-line" data-etq-drag="instagram" style="${layout.mostrarInstagram === false ? 'display:none;' : ''}transform:translate(${Number(layout.posicoes?.instagram?.x)||0}px,${Number(layout.posicoes?.instagram?.y)||0}px) scale(${Number(layout.tamanhos?.instagram)||1});transform-origin:top left;"><span class="ico">📷</span> Instagram: ${esc(insta)}</div>
            </div>
            <div class="label-qr-block" data-etq-drag="qr" style="transform:translate(${Number(layout.posicoes?.qr?.x)||0}px,${Number(layout.posicoes?.qr?.y)||0}px) scale(${Number(layout.tamanhos?.qr)||1});transform-origin:bottom right">
              <div class="label-qr-frame"><img src="${gerarQrDataUrl(it.codigo)}" alt="QR Code"></div>
              <div class="label-code">${esc(it.codigo)}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function viewEtiquetas() {
      const layout = DB.etiquetaLayout || defaultEtiquetaLayout();
      const producoesComItens = DB.producoes.filter(p => (p.itens || []).some(bipItemDisponivel)); // só lotes com etiqueta ainda em estoque
      const producaoSelId = window.ETQ_PRODUCAO_ID && producoesComItens.some(p => p.id === window.ETQ_PRODUCAO_ID)
        ? window.ETQ_PRODUCAO_ID
        : (producoesComItens[producoesComItens.length - 1]?.id || '');

      return `
        <div class="card card-pad">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
            <div>
              <h3>Impressão e Gerador de Etiquetas</h3>
              <p class="hint">Selecione uma produção com estoque para visualizar e imprimir as etiquetas com QR Code. Produções com o estoque zerado não aparecem aqui.</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-secondary" onclick="abrirEditorEtiqueta()">🎨 Editar etiqueta</button>
              <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir Etiquetas</button>
              <button class="btn btn-primary" onclick="salvarEtiquetasPDF()">📄 Salvar como PDF</button>
            </div>
          </div>

          <div class="divider"></div>

          ${producoesComItens.length ? `
          <div class="field" style="max-width:360px;">
            <label>Lote / Produção</label>
            <select class="input" onchange="window.ETQ_PRODUCAO_ID = this.value; render();">
              ${producoesComItens.map(pr => {
                const prNome = (findProduto(pr.produtoId) || {}).nome || 'Produto';
                return `<option value="${pr.id}" ${pr.id === producaoSelId ? 'selected' : ''}>${esc(prNome)} — Lote ${esc(pr.lote)} (${(pr.itens || []).filter(bipItemDisponivel).length} em estoque de ${(pr.itens || []).length})</option>`;
              }).join('')}
            </select>
          </div>
          ` : ''}

          <div class="divider"></div>
          <div class="labels-sheet" id="labelsSheet">
            ${renderLabelsSheetHtml()}
          </div>
        </div>
      `;
    }

    function abrirEditorEtiqueta() {
      const l = DB.etiquetaLayout || (DB.etiquetaLayout = defaultEtiquetaLayout());
      window.ETQ_EDITOR_DRAFT = JSON.parse(JSON.stringify(l));
      const opts = (items, selected) => items.map(([v,t]) => `<option value="${v}" ${selected===v?'selected':''}>${t}</option>`).join('');
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target.classList.contains('modal-backdrop')) fecharModalDirect();">
          <div class="modal etq-editor-modal">
            <div class="modal-head"><div><h3>Editor visual de etiquetas</h3><p class="hint">Personalize o visual e acompanhe a prévia em tempo real.</p></div><button class="modal-close" onclick="fecharModalDirect()">×</button></div>
            <div class="modal-body">
              <div class="etq-editor-grid">
                <div class="etq-editor-controls">
                  <div class="field full"><label>Texto do cabeçalho de contato (opcional)</label><input placeholder="Deixe vazio para ocultar" id="edEtqContato" class="input" value="${esc(l.textoContatoTitulo || '')}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Fundo</label><input id="edEtqFundo" type="color" class="input" value="${esc(l.fundo || '#ffffff')}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Cor do texto</label><input id="edEtqTexto" type="color" class="input" value="${esc(l.corTexto || '#171717')}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Cor da borda</label><input id="edEtqBorda" type="color" class="input" value="${esc(l.corBorda || '#171717')}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Cor de destaque</label><input id="edEtqDestaque" type="color" class="input" value="${esc(l.corDestaque || '#7a1f3d')}" oninput="alterarTamanhoFonteEtiqueta(this.value)"></div>
                  <div class="field full"><label>Família da fonte do elemento selecionado</label><select id="edEtqFonteFamilia" class="input" onchange="atualizarEditorEtiqueta();atualizarFamiliaFonteEtiqueta()">${opts([['Fraunces','Elegante (Fraunces)'],['Manrope','Moderna (Manrope)'],['Arial','Arial'],['Georgia','Georgia'],['Verdana','Verdana']],(l.fontesFamilia||{})[(document.getElementById('edEtqFonteElemento')||{}).value||'titulo'] || 'Fraunces')}</select><p class="hint">Escolha o elemento abaixo e defina a fonte dele, sem alterar os demais.</p></div>
                  <div class="field"><label>Largura da etiqueta (cm)</label><input id="edEtqLarguraCm" type="number" min="2" max="30" step="0.1" class="input" value="${Number(l.larguraCm)||9}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Altura da etiqueta (cm)</label><input id="edEtqAlturaCm" type="number" min="1" max="20" step="0.1" class="input" value="${Number(l.alturaCm)||4}" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field full"><label>Elemento para ajustar a fonte</label><select id="edEtqFonteElemento" class="input" onchange="atualizarControlesFonteEtiqueta();atualizarFamiliaFonteEtiqueta()"><option value="titulo">Título do produto</option><option value="numero">Número da etiqueta</option><option value="lote">Lote</option><option value="validade">Validade</option><option value="contato">Cabeçalho de contato</option><option value="whatsapp">WhatsApp</option><option value="instagram">Instagram</option><option value="qrCodigo">Código abaixo do QR</option></select></div>
                  <div class="field full"><label>Tamanho da fonte: <b id="edEtqFontePxVal">12 px</b></label><input id="edEtqFontePx" type="range" min="5" max="36" step="1" value="12" class="input" oninput="alterarTamanhoFonteEtiqueta(this.value)"></div>
                  <div class="field"><label>Arredondamento: <b id="edEtqRaioVal">${Number(l.raioBorda ?? 12)} px</b></label><input id="edEtqRaio" type="range" min="0" max="28" value="${Number(l.raioBorda ?? 12)}" class="input" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field"><label>Borda: <b id="edEtqBordaVal">${Number(l.espessuraBorda ?? 2)} px</b></label><input id="edEtqEspessura" type="range" min="0" max="6" value="${Number(l.espessuraBorda ?? 2)}" class="input" oninput="atualizarEditorEtiqueta()"></div>
                  <div class="field full"><label>Elementos visíveis</label>
                    <label style="display:flex;gap:7px;align-items:center;text-transform:none;margin:7px 0"><input id="edEtqLote" type="checkbox" ${l.mostrarLote === false?'':'checked'} onchange="atualizarEditorEtiqueta()"> Lote e validade</label>
                    <label style="display:flex;gap:7px;align-items:center;text-transform:none;margin:7px 0"><input id="edEtqContatoVis" type="checkbox" ${l.mostrarContato === false?'':'checked'} onchange="atualizarEditorEtiqueta()"> Título do contato</label>
                    <label style="display:flex;gap:7px;align-items:center;text-transform:none;margin:7px 0"><input id="edEtqWhatsVis" type="checkbox" ${l.mostrarWhatsApp === false?'':'checked'} onchange="atualizarEditorEtiqueta()"> WhatsApp</label>
                    <label style="display:flex;gap:7px;align-items:center;text-transform:none;margin:7px 0"><input id="edEtqInstaVis" type="checkbox" ${l.mostrarInstagram === false?'':'checked'} onchange="atualizarEditorEtiqueta()"> Instagram</label>
                  </div>
                </div>
                <div><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px"><b>Prévia da etiqueta</b><span class="hint">Atualização instantânea</span></div><div class="etq-editor-zoombar"><button type="button" onclick="ajustarZoomEtiqueta(-10)" aria-label="Diminuir zoom">−</button><input id="edEtqZoom" type="range" min=50 max=250 step=10 value=100 oninput="definirZoomEtiqueta(this.value)" aria-label="Zoom da prévia"><span class="zoom-value" id="edEtqZoomVal">100%</span><button type="button" onclick="ajustarZoomEtiqueta(10)" aria-label="Aumentar zoom">+</button><button type="button" onclick="definirZoomEtiqueta(100)">Redefinir</button></div><div class="etq-editor-stage" id="edEtqStage">${renderLabelsSheetHtml()}</div><p class="hint">Use +/− ou o controle de zoom para ver a etiqueta em mais detalhes. Arraste os elementos para reposicioná-los.</p></div>
              </div>
            </div>
            <div class="modal-foot"><button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button><button class="btn btn-primary" onclick="salvarEditorEtiqueta()">Salvar design</button></div>
          </div>
        </div>`;
      // Garante que a prévia contenha somente a primeira etiqueta completa.
      const sheet = document.getElementById('edEtqStage');
      if (sheet) { const first = sheet.querySelector('.label-card'); if (first) { sheet.innerHTML = ''; sheet.appendChild(first); } }
      atualizarEditorEtiqueta(false);
      atualizarControlesFonteEtiqueta();
      definirZoomEtiqueta(100);
      ativarArrasteEtiqueta();
    }


    function definirZoomEtiqueta(valor) {
      const zoom = Math.max(50, Math.min(250, Number(valor) || 100));
      const input = document.getElementById('edEtqZoom');
      const label = document.getElementById('edEtqZoomVal');
      const card = document.querySelector('#edEtqStage .label-card');
      if (input) input.value = String(zoom);
      if (label) label.textContent = zoom + '%';
      if (card) { card.style.zoom = String(zoom / 100); }
    }

    function ajustarZoomEtiqueta(delta) {
      const input = document.getElementById('edEtqZoom');
      definirZoomEtiqueta((Number(input?.value) || 100) + delta);
    }

    function ativarArrasteEtiqueta() {
      const stage = document.getElementById('edEtqStage');
      const card = stage && stage.querySelector('.label-card');
      if (!card) return;
      const removeGuides = () => card.querySelectorAll('.etq-snap-guide').forEach(g => g.remove());
      const guide = (axis, value) => {
        let g = card.querySelector('.etq-guide-' + axis);
        if (!g) { g = document.createElement('i'); g.className = 'etq-snap-guide etq-guide-' + axis; card.appendChild(g); }
        if (axis === 'v') g.style.left = value + 'px'; else g.style.top = value + 'px';
      };
      card.querySelectorAll('[data-etq-drag]').forEach(el => {
        if (el.dataset.etqDragBound === '1') return;
        el.dataset.etqDragBound = '1';
        el.title = 'Clique para selecionar; arraste para mover; use o ponto no canto para redimensionar';
        el.addEventListener('pointerdown', ev => {
          if (ev.button !== 0) return;
          ev.preventDefault(); ev.stopPropagation();
          const key = el.dataset.etqDrag;
          card.querySelectorAll('[data-etq-drag]').forEach(n => n.classList.remove('etq-selected'));
          el.classList.add('etq-selected');
          let handle = el.querySelector('.etq-resize-handle');
          if (!handle) { handle = document.createElement('span'); handle.className = 'etq-resize-handle'; handle.title = 'Arraste para aumentar ou diminuir'; el.appendChild(handle); }
          const pos = (window.ETQ_EDITOR_DRAFT.posicoes ||= {}), sizes = (window.ETQ_EDITOR_DRAFT.tamanhos ||= {});
          const old = pos[key] || {x:0,y:0}; const x0=Number(old.x)||0, y0=Number(old.y)||0;
          const size0=Number(sizes[key])||1, startX=ev.clientX, startY=ev.clientY;
          const resizing = ev.target === handle;
          const snapDistance = 6;
          el.classList.add('etq-dragging'); el.setPointerCapture?.(ev.pointerId);
          const move = e => {
            if (resizing) {
              const scale=Math.max(.45,Math.min(2.8,size0+((e.clientX-startX)+(e.clientY-startY))/130));
              sizes[key]=Math.round(scale*100)/100;
              const x=Number(pos[key]?.x)||0,y=Number(pos[key]?.y)||0;
              el.style.transform=`translate(${x}px,${y}px) scale(${sizes[key]})`;
              return;
            }
            removeGuides();
            let x=x0+e.clientX-startX, y=y0+e.clientY-startY;
            const cardRect=card.getBoundingClientRect();
            const movingRect=el.getBoundingClientRect();
            const others=[...card.querySelectorAll('[data-etq-drag]')].filter(n=>n!==el && n.offsetWidth && n.offsetHeight);
            const candidateX=[{value:0,screen:cardRect.left},{value:cardRect.width/2-movingRect.width/2,screen:cardRect.left+cardRect.width/2},{value:cardRect.width-movingRect.width,screen:cardRect.right-movingRect.width}];
            const candidateY=[{value:0,screen:cardRect.top},{value:cardRect.height/2-movingRect.height/2,screen:cardRect.top+cardRect.height/2},{value:cardRect.height-movingRect.height,screen:cardRect.bottom-movingRect.height}];
            let bestX=null,bestY=null;
            others.forEach(n=>{
              const r=n.getBoundingClientRect();
              const xs=[{screen:r.left,value:x0+(r.left-movingRect.left)},{screen:r.left+r.width/2,value:x0+(r.left+r.width/2-(movingRect.left+movingRect.width/2))},{screen:r.right,value:x0+(r.right-movingRect.right)}];
              const ys=[{screen:r.top,value:y0+(r.top-movingRect.top)},{screen:r.top+r.height/2,value:y0+(r.top+r.height/2-(movingRect.top+movingRect.height/2))},{screen:r.bottom,value:y0+(r.bottom-movingRect.bottom)}];
              xs.forEach(a=>{const delta=Math.abs((movingRect.left + (x-x0) + (a.screen-movingRect.left))-a.screen); const screenDelta=Math.abs((movingRect.left+(e.clientX-startX))-a.screen); if(screenDelta<=snapDistance && (!bestX||screenDelta<bestX.delta)) bestX={delta:screenDelta,offset:a.screen-cardRect.left};});
              ys.forEach(a=>{const screenDelta=Math.abs((movingRect.top+(e.clientY-startY))-a.screen); if(screenDelta<=snapDistance && (!bestY||screenDelta<bestY.delta)) bestY={delta:screenDelta,offset:a.screen-cardRect.top};});
            });
            const scaleX=cardRect.width/(card.offsetWidth||cardRect.width), scaleY=cardRect.height/(card.offsetHeight||cardRect.height);
            if(bestX){ x += (bestX.offset-(movingRect.left-cardRect.left))/scaleX; guide('v',bestX.offset/scaleX); }
            if(bestY){ y += (bestY.offset-(movingRect.top-cardRect.top))/scaleY; guide('h',bestY.offset/scaleY); }
            x=Math.round(x); y=Math.round(y); pos[key]={x,y};
            el.style.transform=`translate(${x}px,${y}px) scale(${size0})`;
          };
          const up = () => { el.classList.remove('etq-dragging'); removeGuides(); el.removeEventListener('pointermove',move); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); };
          el.addEventListener('pointermove',move); el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
        });
      });
      if (!card.dataset.etqDeselectBound) {
        card.dataset.etqDeselectBound='1';
        card.addEventListener('pointerdown', ev => { if (ev.target === card) card.querySelectorAll('[data-etq-drag]').forEach(n=>n.classList.remove('etq-selected')); });
      }
    }

    const ETQ_FONT_SELECTORS = {titulo:'.label-name', numero:'.label-num', lote:'[data-etq-drag="lote"]', validade:'[data-etq-drag="validade"]', contato:'.label-contact-title', whatsapp:'[data-etq-drag="whatsapp"]', instagram:'[data-etq-drag="instagram"]', qrCodigo:'.label-code'};
    function aplicarFontesEtiqueta(root, layout) {
      if (!root || !layout) return;
      const map = layout.fontesPx || {};
      Object.entries(ETQ_FONT_SELECTORS).forEach(([key, selector]) => {
        const el = root.querySelector(selector);
        if (el && Number(map[key]) > 0) el.style.fontSize = Number(map[key]) + 'px';
      });
    }
    function aplicarFamiliasFonteEtiqueta(root, layout) {
      if (!root || !layout) return;
      const familias = layout.fontesFamilia || {};
      Object.entries(ETQ_FONT_SELECTORS).forEach(([key, selector]) => {
        const el = root.querySelector(selector);
        if (el) {
          const familia = familias[key] || (key === 'titulo' ? (layout.fonteTitulo || 'Fraunces') : null);
          if (familia) el.style.setProperty('font-family', `\"${familia}\"`, 'important');
        }
      });
    }

    function atualizarFamiliaFonteEtiqueta() {
      const l = window.ETQ_EDITOR_DRAFT || DB.etiquetaLayout || defaultEtiquetaLayout();
      const key = document.getElementById('edEtqFonteElemento')?.value || 'titulo';
      const select = document.getElementById('edEtqFonteFamilia');
      if (select) {
        const familia = (l.fontesFamilia || {})[key] || (key === 'titulo' ? (l.fonteTitulo || 'Fraunces') : 'Fraunces');
        select.value = familia;
      }
      const stage = document.getElementById('edEtqStage');
      if (stage) aplicarFamiliasFonteEtiqueta(stage.querySelector('.label-card'), l);
    }
    function alterarTamanhoFonteEtiqueta(valor) {
      const l = window.ETQ_EDITOR_DRAFT || (window.ETQ_EDITOR_DRAFT = JSON.parse(JSON.stringify(DB.etiquetaLayout || defaultEtiquetaLayout())));
      const key = document.getElementById('edEtqFonteElemento')?.value || 'titulo';
      const px = Math.max(5, Math.min(36, Number(valor) || 12));
      l.fontesPx ||= {};
      l.fontesPx[key] = px;
      const label = document.getElementById('edEtqFontePxVal');
      if (label) label.textContent = px + ' px';
      const stage = document.getElementById('edEtqStage');
      const card = stage?.querySelector('.label-card');
      const selector = ETQ_FONT_SELECTORS[key];
      if (card && selector) {
        const el = card.querySelector(selector);
        if (el) el.style.setProperty('font-size', px + 'px', 'important');
      }
      // Atualiza também as etiquetas já renderizadas, sem alterar os demais elementos.
      document.querySelectorAll('.label-card').forEach(c => aplicarFontesEtiqueta(c, l));
    }

    function atualizarControlesFonteEtiqueta() {
      const l = window.ETQ_EDITOR_DRAFT || DB.etiquetaLayout || defaultEtiquetaLayout();
      const key = document.getElementById('edEtqFonteElemento')?.value || 'titulo';
      const px = Number(l.fontesPx?.[key]) || ({titulo:18,numero:12,lote:8,validade:8,contato:8,whatsapp:8,instagram:8,qrCodigo:6}[key] || 12);
      const range = document.getElementById('edEtqFontePx'), label = document.getElementById('edEtqFontePxVal');
      if (range) range.value = String(px); if (label) label.textContent = px + ' px';
    }

    function atualizarEditorEtiqueta(persistirAgora = false) {
      const l = window.ETQ_EDITOR_DRAFT || (window.ETQ_EDITOR_DRAFT = JSON.parse(JSON.stringify(DB.etiquetaLayout || defaultEtiquetaLayout())));
      const val = id => document.getElementById(id);
      if (val('edEtqContato')) l.textoContatoTitulo = val('edEtqContato').value;
      if (val('edEtqFundo')) l.fundo = val('edEtqFundo').value;
      if (val('edEtqTexto')) l.corTexto = val('edEtqTexto').value;
      if (val('edEtqBorda')) l.corBorda = val('edEtqBorda').value;
      if (val('edEtqDestaque')) l.corDestaque = val('edEtqDestaque').value;
      if (val('edEtqFonteFamilia') && val('edEtqFonteElemento')) {
        const fontKey = val('edEtqFonteElemento').value;
        l.fontesFamilia ||= {};
        l.fontesFamilia[fontKey] = val('edEtqFonteFamilia').value;
      }
      if (val('edEtqLarguraCm')) l.larguraCm = Math.max(2, Math.min(30, Number(val('edEtqLarguraCm').value)||9));
      if (val('edEtqAlturaCm')) l.alturaCm = Math.max(1, Math.min(20, Number(val('edEtqAlturaCm').value)||4));
      if (val('edEtqFonteElemento') && val('edEtqFontePx')) { l.fontesPx ||= {}; l.fontesPx[val('edEtqFonteElemento').value] = Number(val('edEtqFontePx').value)||12; }
      if (val('edEtqFontePxVal') && val('edEtqFontePx')) val('edEtqFontePxVal').textContent = val('edEtqFontePx').value + ' px';
      if (val('edEtqRaio')) l.raioBorda = Number(val('edEtqRaio').value);
      if (val('edEtqEspessura')) l.espessuraBorda = Number(val('edEtqEspessura').value);
      if (val('edEtqLote')) l.mostrarLote = val('edEtqLote').checked;
      if (val('edEtqContatoVis')) l.mostrarContato = val('edEtqContatoVis').checked;
      if (val('edEtqWhatsVis')) l.mostrarWhatsApp = val('edEtqWhatsVis').checked;
      if (val('edEtqInstaVis')) l.mostrarInstagram = val('edEtqInstaVis').checked;
      if (val('edEtqRaioVal')) val('edEtqRaioVal').textContent = l.raioBorda + ' px';
      if (val('edEtqBordaVal')) val('edEtqBordaVal').textContent = l.espessuraBorda + ' px';
      const stage = val('edEtqStage');
      if (stage) {
        const card = stage.querySelector('.label-card');
        if (card) {
          card.style.setProperty('--etq-editor-bg', l.fundo || '#fff');
          card.style.setProperty('--etq-editor-text', l.corTexto || '#171717');
          card.style.setProperty('--etq-editor-border', l.corBorda || '#171717');
          card.style.setProperty('--etq-editor-accent', l.corDestaque || '#7a1f3d');
          card.style.setProperty('--etq-editor-radius', (l.raioBorda ?? 12) + 'px');
          card.style.setProperty('--etq-editor-border-width', (l.espessuraBorda ?? 2) + 'px');
          card.style.setProperty('--etq-editor-title-font', "'" + ((l.fontesFamilia||{}).titulo || l.fonteTitulo || 'Fraunces') + "'");
          card.style.width = (Number(l.larguraCm)||9) + 'cm'; card.style.minHeight = (Number(l.alturaCm)||4) + 'cm';
          aplicarFontesEtiqueta(card, l);
          aplicarFamiliasFonteEtiqueta(card, l);
          const lote = card.querySelector('.label-lote'); if (lote) lote.style.display = l.mostrarLote ? '' : 'none';
          const contato = card.querySelector('.label-contact-title'); if (contato) { contato.style.display = l.mostrarContato ? '' : 'none'; contato.textContent = l.textoContatoTitulo || ''; contato.style.display = (l.mostrarContato && !!l.textoContatoTitulo.trim()) ? '' : 'none'; }
          const whats = card.querySelector('.label-contact-line'); if (whats) whats.style.display = l.mostrarWhatsApp ? '' : 'none';
          const insta = card.querySelectorAll('.label-contact-line')[1]; if (insta) insta.style.display = l.mostrarInstagram ? '' : 'none';
        }
      }
      if (persistirAgora) salvarEditorEtiqueta();
    }

    function salvarEditorEtiqueta() {
      DB.etiquetaLayout = JSON.parse(JSON.stringify(window.ETQ_EDITOR_DRAFT || DB.etiquetaLayout || defaultEtiquetaLayout()));
      delete window.ETQ_EDITOR_DRAFT;
      persist('etiquetaLayout');
      aplicarLayoutEtiquetaCSS();
      const sheet = document.getElementById('labelsSheet');
      if (sheet) sheet.innerHTML = renderLabelsSheetHtml();
      fecharModalDirect();
      toast('Design da etiqueta salvo!', 'ok');
    }

    function atualizarLayoutEtiqueta() {
      const layout = DB.etiquetaLayout || (DB.etiquetaLayout = defaultEtiquetaLayout());
      const largEl = document.getElementById('etqLargura');
      const altEl = document.getElementById('etqAltura');
      const oriEl = document.getElementById('etqOrientacao');
      const gapEl = document.getElementById('etqGap');
      const whatsEl = document.getElementById('etqWhats');
      const instaEl = document.getElementById('etqInsta');
      const tituloEl = document.getElementById('etqTituloScale');

      if (largEl) layout.larguraCm = parseFloat(largEl.value) || layout.larguraCm;
      if (altEl) layout.alturaCm = parseFloat(altEl.value) || layout.alturaCm;
      if (oriEl) layout.orientacao = oriEl.value;
      if (gapEl) layout.gapMm = parseFloat(gapEl.value);
      if (whatsEl) layout.whatsapp = whatsEl.value;
      if (instaEl) layout.instagram = instaEl.value;
      if (tituloEl) layout.tituloScale = parseFloat(tituloEl.value) || 1;

      const gapValEl = document.getElementById('etqGapVal');
      if (gapValEl) gapValEl.textContent = (layout.gapMm || 0) + 'mm';
      const tituloValEl = document.getElementById('etqTituloVal');
      if (tituloValEl) tituloValEl.textContent = Math.round((layout.tituloScale || 1) * 100) + '%';

      aplicarLayoutEtiquetaCSS();
      const sheetEl = document.getElementById('labelsSheet');
      if (sheetEl) sheetEl.innerHTML = renderLabelsSheetHtml();
      ajustarFonteTitulo();

      persist('etiquetaLayout');
    }

    window.aplicarLayoutEtiquetaCSS = function aplicarLayoutEtiquetaCSS() {
      const layout = DB.etiquetaLayout || defaultEtiquetaLayout();
      const root = document.documentElement;
      const largura = Number(layout.larguraCm) || 9;
      const altura = Number(layout.alturaCm) || 4;

      root.style.setProperty('--lbl-w', largura + 'cm');
      root.style.setProperty('--lbl-h', altura + 'cm');
      root.style.setProperty('--lbl-gap', (layout.gapMm != null ? layout.gapMm : 3) + 'mm');
      root.style.setProperty('--lbl-title-scale', layout.tituloScale || 1);
      root.style.setProperty('--etq-page-w', largura + 'cm');
      root.style.setProperty('--etq-page-h', altura + 'cm');
      document.querySelectorAll('.label-card').forEach(card => { card.style.width = largura + 'cm'; card.style.minHeight = altura + 'cm'; aplicarFontesEtiqueta(card, layout); aplicarFamiliasFonteEtiqueta(card, layout); });

      ajustarFonteTitulo();
    };

    function ajustarFonteTitulo() {
      document.querySelectorAll('.label-card .label-name').forEach(el => {
        el.style.fontSize = '';
        el.style.whiteSpace = '';
      });
    }
    window.ajustarFonteTitulo = ajustarFonteTitulo;

    function salvarEtiquetasPDF() {
      document.body.classList.add('etq-export-pdf');
      toast('Na janela de impressão, selecione "Salvar como PDF" como destino.', 'ok');
      setTimeout(() => {
        window.print();
        setTimeout(() => document.body.classList.remove('etq-export-pdf'), 600);
      }, 200);
    }

          <h3>Relatório Consolidado</h3>
          <p class="hint">Estatísticas detalhadas de consumo de insumos e margem de lucro.</p>
          <div class="divider"></div>

    const n=Number(valor);
    return Number.isFinite(n) ? Math.min(100,Math.max(0,n)) : null;
  }
  function saleCommissionRate(v){
    if(v && v.comissaoPorcentagem!==undefined && v.comissaoPorcentagem!==null && v.comissaoPorcentagem!==''){
      const taxa=limitarTaxaComissao(v.comissaoPorcentagem);
      if(taxa!==null) return taxa;
    }
    const uid=saleVendorUid(v);
    if(!uid) return 0; // venda sem vendedor identificado não recebe comissão presumida
    const perfil=(window.__usersCache||[]).find(u=>u.uid===uid);
    if(perfil){
      const taxa=limitarTaxaComissao(perfil.comissaoPorcentagem);
      if(taxa!==null) return taxa;
    }
    if(uid===window.currentFirebaseUser?.uid){
      const taxa=limitarTaxaComissao(window.currentUserComissao);
      if(taxa!==null) return taxa;
    }
    return 0; // taxa histórica ausente: não inventar um percentual
  }
  function saleCommission(v){ return saleTotal(v) * saleCommissionRate(v) / 100; }
  function saleRepasse(v){ return saleTotal(v) - saleCommission(v); }
  window.vendasFaturamento = window.vendasFaturamento || saleTotal;
  window.saleCommission = saleCommission;
  window.saleCommissionRate = saleCommissionRate;
  // Custo estimado dos insumos de uma venda (ficha técnica ÷ rendimento × quantidade)
  function saleCost(v){
    let total=0;
    for(const it of (v.itens||[])){
      const qty=Number(it.qty);
      if(!Number.isFinite(qty)||qty<0) return null;
      let unit=null;
      if(Object.prototype.hasOwnProperty.call(it,'custoUnitarioInsumos')){
        unit=it.custoUnitarioInsumos===null ? null : Number(it.custoUnitarioInsumos);
        if(!Number.isFinite(unit)||unit<0) return null;
      } else {
        // Vendas legadas sem snapshot: usa custo atual como estimativa, se a ficha estiver completa.
        const p=findProduto(it.produtoId);
        unit=p?custoUnitarioProduto(p):null;
        if(!Number.isFinite(unit)||unit<0) return null;
      }
      total+=unit*qty;
    }
    return total;
  }
  window.saleCost = saleCost;

  function vendaPrecisaAcerto(v){ return !!saleVendorUid(v) && saleCommissionRate(v) > 0; }
  window.vendaAguardandoAcerto = function(v){ return vendaPrecisaAcerto(v) && v.statusAcerto !== 'quitado'; };

      const data=String(v.acertoData||v.data||'').slice(0,10);
      const chave=(v.acertoId||('v'+v.id))+'|'+data;

      g.valor+=c; g.qtd++; g.vend[v.vendedorEmail||'sem vendedor']=1;

      if (role === ROLES.VENDEDOR) {
        const q = window.query(col, window.where('vendedorUid','==',user.uid));

      if (!vendas.length && role !== ROLES.VENDEDOR) {
        return await loadKey('vendas', []);

      localStorage.setItem('docemg_vendas', JSON.stringify(vendas));
      return vendas;

  function montarProducoesVendedor(lista, vendas){
    const usados=new Set();
    (vendas||[]).forEach(v=>{
      if(v.codigo) usados.add(String(v.codigo).toUpperCase());
      (v.etiquetasBaixadas||[]).forEach(c=>usados.add(String(c).toUpperCase()));
    });
    const grupos={};
    (lista||[]).forEach(e=>{
      const k=e.p+'|'+e.l+'|'+e.v;
      const g=grupos[k]||(grupos[k]={id:'pub-'+k,produtoId:e.p,lote:e.l,dataValidade:e.v,quantidade:0,itens:[]});
      g.itens.push({codigo:e.c,status:usados.has(String(e.c).toUpperCase())?'vendido':'disponivel'});
      g.quantidade++;
    });
    return Object.values(grupos);
  }
  async function conciliarBaixasVendedores(){
    if(!isAdmin()) return;
    const pend=(DB.vendas||[]).filter(v=>v.baixaPendente===true);
    if(!pend.length) return;
    let conflitos=0;
    pend.forEach(v=>{
      const it0=(v.itens||[])[0]||{}; const qty=Number(it0.qty)||1; const prod=findProduto(it0.produtoId);
      const codes=(v.origem==='bipagem'&&v.codigo)?[v.codigo]:(v.etiquetasBaixadas||[]);
      const aplicados=[], conf=[];
      codes.forEach(c=>{
        const a=findItemByCode(c);
        if(a&&a.item){ if(!a.item.status||a.item.status==='disponivel'){ a.item.status='vendido'; aplicados.push(c); } else conf.push(c); }
      });
      if(v.origem!=='bipagem' && aplicados.length+conf.length<qty){
        const extra=baixarEtiquetasDoProduto(it0.produtoId, qty-aplicados.length-conf.length);
        v.etiquetasBaixadas=[...(v.etiquetasBaixadas||[]),...extra];

  window.__comissaoDe=''; window.__comissaoAte='';
  const FILTROS_COMISSAO=[['hoje','Hoje'],['7dias','7 dias'],['30dias','1 Mês'],['custom','Personalizado']];
  function ymdComissao(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function periodoComissao(){
    const hoje=new Date(); hoje.setHours(0,0,0,0);
    let inicio=new Date(hoje), fim=new Date(hoje);
    const f=window.__comissaoFiltro;
    if(f==='hoje'){}
    else if(/^\d+dias$/.test(f)) inicio.setDate(inicio.getDate()-(parseInt(f,10)-1));
    else if(f==='mes_anterior'){ inicio=new Date(hoje.getFullYear(),hoje.getMonth()-1,1); fim=new Date(hoje.getFullYear(),hoje.getMonth(),0); }
    else if(f==='tudo') inicio=new Date(2000,0,1);
    else if(f==='custom'){
      inicio=window.__comissaoDe?new Date(window.__comissaoDe+'T00:00:00'):new Date(hoje.getFullYear(),hoje.getMonth(),1);
      fim=window.__comissaoAte?new Date(window.__comissaoAte+'T00:00:00'):new Date(hoje);
      if(isNaN(inicio)) inicio=new Date(hoje.getFullYear(),hoje.getMonth(),1);
      if(isNaN(fim)) fim=new Date(hoje);
      if(inicio>fim){ const t=inicio; inicio=fim; fim=t; }
    }
    else inicio.setDate(1);
    inicio.setHours(0,0,0,0); fim.setHours(23,59,59,999);
    return {inicio,fim};
  }

  // Custo unitário (insumos) de cada produto em estoque, pela ficha técnica
  function custoUnitarioProduto(p){
    if(!p || !Array.isArray(p.receita) || !p.receita.length) return null;
    const rend=Number(p.rendimento);
    if(!Number.isFinite(rend)||rend<=0) return null;
    let ficha=0;
    for(const r of p.receita){
      const ins=findInsumo(r.insumoId), qtd=Number(r.qtd);
      if(!ins||!Number.isFinite(qtd)||qtd<0||!Number.isFinite(Number(ins.custo))||Number(ins.custo)<0) return null;
      ficha+=Number(ins.custo)*qtd;
    }
    return ficha/rend;
  }
  function cardCustoUnitarioEstoque(){
    const prods=(DB.produtos||[]).filter(p=>(Number(p.estoque)||0)>0).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt-BR'));
    let totalEstoque=0;
    const linhas=prods.map(p=>{
      const cu=custoUnitarioProduto(p); const preco=Number(p.preco)||0; const q=Number(p.estoque)||0;
      if(cu!==null) totalEstoque+=cu*q;
      const margem=cu!==null?preco-cu:null;
      return `<tr><td>${esc(p.nome)}</td><td>${q}</td><td>${cu!==null?fmtMoney(cu):'<span class="hint">sem ficha técnica</span>'}</td><td>${fmtMoney(preco)}</td><td>${margem!==null?fmtMoney(margem):'—'}</td><td>${cu!==null?fmtMoney(cu*q):'—'}</td></tr>`;
    }).join('');
    return `<div class="card card-pad" style="margin-bottom:20px"><div class="section-title" style="margin-top:0"><h2>Custo unitário por produto em estoque</h2><span class="hint">Custo de insumos pela ficha técnica · estoque atual: ${fmtMoney(totalEstoque)}</span></div>
      <div class="table-wrap"><table><thead><tr><th>Produto</th><th>Em estoque</th><th>Custo unitário</th><th>Preço de venda</th><th>Margem por un.</th><th>Custo do estoque</th></tr></thead><tbody>${linhas||'<tr><td colspan="6" class="empty">Nenhum produto com estoque no momento.</td></tr>'}</tbody></table></div></div>`;
  }
  // Demonstrativo do período (somente admin): faturamento, custo, comissões e pró-labore
  function demonstrativoComissao(lista){
    const fat=lista.reduce((t,v)=>t+saleTotal(v),0);
    const custos=lista.map(v=>saleCost(v));
    const custoCompleto=custos.every(v=>Number.isFinite(v));
    const custo=custos.reduce((t,v)=>t+(Number.isFinite(v)?v:0),0);
    const com=lista.reduce((t,v)=>t+saleCommission(v),0);
    const apurado=custoCompleto?fat-custo-com:null;
    const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const {inicio,fim}=periodoComissao(); const di=ymd(inicio), df=ymd(fim);
    const todos=window.__comissaoVendedor==='todos';
    const retiradas=todos?(DB.caixa||[]).filter(c=>c.tipo==='saida'&&/pr[óo]-?labore|retirada/i.test(c.categoria||'')&&c.data>=di&&c.data<=df).reduce((t,c)=>t+(Number(c.valor)||0),0):0;
    const saldo=apurado===null?null:apurado-retiradas;
    const cor=saldo===null?'':saldo>=0?'#2f7d4f':'#b3392f';
    const rotulo=saldo===null?'Indisponível':saldo>=0?'Saldo parcial positivo':'Saldo parcial negativo';
    const nota=!custoCompleto?'Há venda(s) sem ficha técnica/custo completo; resultado parcial não calculado.':todos?`Resultado parcial ${fmtMoney(apurado)} − retiradas no caixa ${fmtMoney(retiradas)}`:'Escolha "Todos os vendedores" para abater as retiradas do caixa';
    return `<div class="section-title" style="margin-top:0"><h2>Demonstrativo do período</h2><span class="hint">Faturamento − insumos − comissões. Não inclui todas as despesas do negócio.</span></div>
      <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px">
        <div class="card stat"><div class="label">Faturamento</div><div class="value">${fmtMoney(fat)}</div><div class="delta">${lista.length} venda(s) no período</div></div>
        <div class="card stat"><div class="label">Custo conhecido dos produtos</div><div class="value">${custoCompleto?fmtMoney(custo):'—'}</div><div class="delta">${custoCompleto?'Insumos pela ficha técnica':'Há venda(s) com custo não identificado'}</div></div>
        <div class="card stat"><div class="label">Comissões</div><div class="value">${fmtMoney(com)}</div><div class="delta">Conforme taxa registrada/perfil</div></div>
        <div class="card stat"><div class="label">Resultado parcial</div><div class="value">${apurado===null?'—':fmtMoney(apurado)}</div><div class="delta">Antes das demais despesas e impostos</div></div>
        <div class="card stat"${cor?` style="border:1.5px solid ${cor}"`:''}><div class="label">${rotulo}</div><div class="value"${cor?` style="color:${cor}"`:''}>${saldo===null?'—':fmtMoney(Math.abs(saldo))}</div><div class="delta">${nota}</div></div>
      </div>${cardCustoUnitarioEstoque()}`;
  }
  // ---------- Lucro estimado x real (acumulado mês a mês), retirada e capital de giro ----------
  // Estimado: vendas − custo dos insumos (ficha técnica) − comissões, mesmo que o dinheiro ainda não tenha chegado.
  // Real: o que entrou de fato no caixa − o que saiu de fato (insumos, embalagens, contas, comissões pagas...),
  //       sem contar aportes/empréstimos (não são lucro) nem as próprias retiradas.
  const RE_RETIRADA=/pr[óo]-?labore|retirada/i;
  const RE_FINANC=/aporte|investimento|empr[ée]stimo/i;
  function pctRetirada(){
    const n=(DB.config||{}).pctRetirada; const x=(n===null||n===undefined||n==='')?NaN:Number(n);
    return Number.isFinite(x)?Math.min(100,Math.max(0,x)):50;
  }
  function resumoLucro(){
    const extrato=(typeof extratoCaixa==='function')?extratoCaixa():[];
    const mesAtual=todayISO().slice(0,7);
    const meses={};
     const M=ym=>meses[ym]||(meses[ym]={ym:ym,estimado:0,estimadoIncompleto:false,real:0,retirado:0,acumulado:0});
     (DB.vendas||[]).forEach(v=>{
       const ym=String(v.data||'').slice(0,7); if(!ym) return;
       const m=M(ym), custo=saleCost(v);
       if(!Number.isFinite(custo)) m.estimadoIncompleto=true;
       else m.estimado+=saleTotal(v)-custo-saleCommission(v);
     });
    extrato.forEach(l=>{
      const ym=String(l.data||'').slice(0,7); if(!ym) return;
      const val=Number(l.valor)||0, cat=l.categoria||'';
      if(l.tipo==='saida'){ if(RE_RETIRADA.test(cat)) M(ym).retirado+=val; else M(ym).real-=val; }
      else if(!RE_FINANC.test(cat)) M(ym).real+=val;
    });
     M(mesAtual);
     Object.values(meses).forEach(m=>{ if(m.estimadoIncompleto) m.estimado=null; });
     const lista=Object.values(meses).sort((a,b)=>a.ym<b.ym?-1:(a.ym>b.ym?1:0));
    let ac=0; lista.forEach(r=>{ ac+=r.real; r.acumulado=ac; });
    const estimadoAcum=lista.every(r=>Number.isFinite(r.estimado))?lista.reduce((t,r)=>t+r.estimado,0):null;
    const retiradoAcum=lista.reduce((t,r)=>t+r.retirado,0);
    const pct=pctRetirada();
    const liberado=Math.max(0,ac)*pct/100;
    const saldoCaixa=extrato.length?extrato[extrato.length-1].saldoAcumulado:(Number(DB.config&&DB.config.saldoInicialCaixa)||0);
    const disponivel=Math.max(0,Math.min(liberado-retiradoAcum,saldoCaixa));
    const aReceber=(DB.vendas||[]).filter(v=>window.vendaAguardandoAcerto&&window.vendaAguardandoAcerto(v)).reduce((t,v)=>t+saleRepasse(v),0);
    const estInsumos=(DB.insumos||[]).reduce((t,i)=>t+Math.max(0,Number(i.estoque)||0)*(Number(i.custo)||0),0);
    const estProdutos=(DB.produtos||[]).reduce((t,p)=>{ const cu=custoUnitarioProduto(p); return t+(cu!==null&&cu!==undefined?cu*Math.max(0,Number(p.estoque)||0):0); },0);
    const capital=saldoCaixa+aReceber+estInsumos+estProdutos;
    return {lista:lista,atual:meses[mesAtual],estimadoAcum:estimadoAcum,realAcum:ac,retiradoAcum:retiradoAcum,pct:pct,liberado:liberado,saldoCaixa:saldoCaixa,disponivel:disponivel,retido:ac-retiradoAcum,aReceber:aReceber,estInsumos:estInsumos,estProdutos:estProdutos,capital:capital};
  }
  window.resumoLucro=resumoLucro;
  window.cardLucroCapital=function(){
    if(!isAdmin()) return '';
    const r=resumoLucro(); const at=r.atual||{estimado:0,real:0};
    const verde='#2f7d4f', verm='#b3392f';
    const card=(rot,val,sub,cor)=>`<div class="card stat"${cor?` style="border:1.5px solid ${cor}"`:''}><div class="label">${rot}</div><div class="value"${cor?` style="color:${cor}"`:''}>${Number.isFinite(val)?fmtMoney(val):'—'}</div><div class="delta">${sub}</div></div>`;
    const grade='display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px';
    const linhas=r.lista.slice().reverse().slice(0,12).map(m=>`<tr><td>${m.ym.slice(5)}/${m.ym.slice(0,4)}</td><td>${Number.isFinite(m.estimado)?fmtMoney(m.estimado):'—'}</td><td>${fmtMoney(m.real)}</td><td>${fmtMoney(m.retirado)}</td><td><b>${fmtMoney(m.acumulado)}</b></td></tr>`).join('');
    return `<div style="margin-top:16px">
      <div class="section-title" style="margin-top:0"><h2>Caixa operacional e retiradas</h2><span class="hint">Acumulado de caixa · ${r.pct}% da sobra operacional liberada (ajuste em Configurações)</span></div>
      <div class="help-note"><b>Resultado parcial estimado:</b> vendas − custo dos insumos − comissões; não inclui necessariamente todas as despesas, taxas e impostos. Meses com custo incompleto aparecem como “—”. <b>Sobra operacional de caixa:</b> entradas e saídas registradas, excluindo aportes/empréstimos e retiradas. É uma medida de caixa, não lucro contábil.</div>
      <div style="${grade}">
        ${card('Resultado parcial (mês)',at.estimado,Number.isFinite(r.estimadoAcum)?'Acumulado: '+fmtMoney(r.estimadoAcum):'Acumulado indisponível: há mês(es) com custo incompleto')}
        ${card('Sobra operacional de caixa (mês)',at.real,'Acumulado: '+fmtMoney(r.realAcum),at.real>=0?'':verm)}
        ${card('Liberado para retirada',r.liberado,r.pct+'% da sobra operacional acumulada, limitada ao saldo de caixa')}
        ${card('Já retirado',r.retiradoAcum,'Retiradas lançadas no caixa')}
        ${card('Disponível para retirar',r.disponivel,'Limitado ao saldo do caixa ('+fmtMoney(r.saldoCaixa)+')',r.disponivel>0?verde:'')}
        ${card('Reserva de caixa estimada',r.retido,'Sobra operacional acumulada − retiradas',r.retido>=0?'':verm)}
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px"><button class="btn btn-gold" onclick="modalRetirada()">💰 Retirar lucro</button></div>
      <div class="section-title" style="margin-top:0"><h2>Capital de giro estimado</h2><span class="hint">Caixa + a receber + estoques a custo; não deduz contas a pagar</span></div>
      <div style="${grade}">
        ${card('Saldo do caixa',r.saldoCaixa,'Dinheiro recebido − saídas')}
        ${card('A receber de vendedores',r.aReceber,'Repasses pendentes de acerto')}
        ${card('Estoque de insumos',r.estInsumos,'Estoque × custo unitário')}
        ${card('Estoque de produtos',r.estProdutos,'Somente produtos com ficha técnica completa')}
        ${card('Capital de giro estimado',r.capital,'Após retirada sugerida: '+fmtMoney(r.capital-r.disponivel)+' · contas a pagar não cadastradas',r.capital>=0?verde:verm)}
      </div>
      <div class="card card-pad" style="margin-bottom:16px"><div class="section-title" style="margin-top:0"><h2>Mês a mês</h2><span class="hint">Últimos 12 meses</span></div>
        <div class="table-wrap"><table><thead><tr><th>Mês</th><th>Lucro estimado</th><th>Lucro real</th><th>Retirado</th><th>Real acumulado</th></tr></thead><tbody>${linhas}</tbody></table></div>
      </div>
    </div>`;
  };
  window.modalRetirada=function(){
    if(!isAdmin()) return toast('Ação disponível somente para o administrador.','err');
    const r=resumoLucro(); const sug=Math.round(r.disponivel*100)/100;
    document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="fecharModal(event)"><div class="modal"><div class="modal-head"><h3>Retirar lucro</h3><button class="modal-close" onclick="fecharModalDirect()">×</button></div>
      <div class="modal-body">
        <p class="hint">Disponível agora: <b>${fmtMoney(r.disponivel)}</b> (${r.pct}% do sobra operacional acumulada − já retirado, limitada ao saldo do caixa). Você pode retirar outro valor.</p>
        <div class="field-row"><div class="field"><label>Valor (R$)</label><input type="number" step="0.01" min="0" id="retValor" class="input" value="${sug}"></div><div class="field"><label>Data</label><input type="date" id="retData" class="input" value="${todayISO()}"></div></div>
        <div class="field"><label>Descrição (opcional)</label><input type="text" id="retDesc" class="input" placeholder="Ex.: pró-labore de outubro"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button><button class="btn btn-primary" onclick="salvarRetirada()">Confirmar retirada</button></div></div></div>`;
  };
  window.salvarRetirada=function(){
    if(!isAdmin()) return toast('Ação disponível somente para o administrador.','err');
    const valor=parseFloat(document.getElementById('retValor').value)||0;
    if(valor<=0) return toast('Informe um valor maior que zero','err');
    const disp=resumoLucro().disponivel;
    if(valor>disp+0.005 && !confirm('O valor é maior que o disponível ('+fmtMoney(disp)+'). Retirar mesmo assim?')) return;
    DB.caixa.push({id:uid(),tipo:'saida',data:document.getElementById('retData').value||todayISO(),categoria:'Retirada/Pró-labore',descricao:document.getElementById('retDesc').value.trim()||'Retirada de lucro',valor:valor});
    persist('caixa'); fecharModalDirect(); render(); toast('Retirada registrada!','ok');
  };
  window.viewComissoes = function(){
    let vendedores=[];
    if(isAdmin()) vendedores=window.__usersCache.filter(u=>u.role==='vendedor');
    const lista=vendasComissao(); const r=comissaoResumo(lista); const demo=isAdmin()?demonstrativoComissao(lista):''; const selN=vendasSelecionadasComissao().length; const pendN=lista.filter(v=>v.statusAcerto!=='quitado').length;
    const seletor=isAdmin()?`<div class="field"><label>Vendedor</label><select class="input" onchange="window.__comissaoVendedor=this.value; window.__comissaoSel={}; render()"><option value="todos" ${window.__comissaoVendedor==='todos'?'selected':''}>Todos os vendedores</option>${vendedores.map(u=>`<option value="${esc(u.uid)}" ${window.__comissaoVendedor===u.uid?'selected':''}>${esc(u.email||u.uid)} · ${Number(u.comissaoPorcentagem??20)}%</option>`).join('')}</select></div>`:`<div class="help-note"><b>Comissão atual:</b> ${Number(window.currentUserComissao)}% · este painel mostra somente suas próprias vendas.</div>`;
    const rows=lista.slice().sort((a,b)=>saleDate(b)-saleDate(a)).map(v=>{const t=saleTotal(v),c=saleCommission(v),rp=saleRepasse(v),item=v.itens?.[0]||{}; const p=findProduto(item.produtoId); return `<tr>${isAdmin()?`<td style="width:52px;padding:2px"><label class="chk-wrap"><input type="checkbox" class="chk-comissao" data-id="${esc(v.id)}" ${v.statusAcerto==='quitado'?'disabled':''} ${window.__comissaoSel[v.id]&&v.statusAcerto!=='quitado'?'checked':''} onchange="toggleSelComissao('${esc(v.id)}',this.checked)"></label></td>`:''}<td class="mono">${fmtDateTime(v.data)}</td><td>${esc(p?.nome||item.produtoId||'—')}</td><td>${item.qty||0}</td><td>${esc(v.localCanal||'—')}</td>${isAdmin()?`<td>${esc(v.vendedorEmail||'—')}</td>`:''}<td>${fmtMoney(t)}${isAdmin()?`<br><small class="mono" style="opacity:.65">custo ${fmtMoney(saleCost(v))}</small>`:''}</td><td>${saleCommissionRate(v).toFixed(1)}%</td><td>${fmtMoney(c)}</td><td>${fmtMoney(rp)}</td><td>${v.statusAcerto==='quitado'?'<span class="badge badge-ok">Quitado</span>':'<span class="badge badge-warn">Pendente</span>'}</td>${isAdmin()?`<td style="text-align:right;white-space:nowrap">${v.statusAcerto==='quitado'?`<button class="btn btn-secondary btn-sm" onclick="marcarVendaQuitada('${esc(v.id)}',false)">Desfazer</button>`:`<button class="btn btn-gold btn-sm" onclick="marcarVendaQuitada('${esc(v.id)}',true)">✓ Quitar</button>`}</td>`:''}</tr>`}).join('');
    return `${seletor}${filtroComissaoHtml()}
      ${demo}
      <div class="grid grid-3"><div class="card stat"><div class="label">Total Vendido</div><div class="value">${fmtMoney(r.vendas)}</div><div class="delta">Pendente de acerto</div></div><div class="card stat"><div class="label">Comissão do Vendedor</div><div class="value">${fmtMoney(r.comissao)}</div><div class="delta">Ganhos no período</div></div><div class="card stat"><div class="label">Valor a Repassar</div><div class="value">${fmtMoney(r.repasse)}</div><div class="delta">Prestação de contas pendente</div></div></div>
      ${isAdmin()?`<div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin:16px 0"><button id="btnTransfSel" class="btn btn-secondary" onclick="abrirTransferenciaVendas()">⇄ Transferir selecionadas (${selN})</button><button class="btn btn-gold" onclick="marcarAcertoRealizado()">✓ Marcar Acerto Realizado / Quitar Prestação</button></div>`:''}
      <div class="card card-pad"><div class="section-title" style="margin-top:0"><h2>Extrato de Vendas</h2><span class="hint">${lista.length} lançamento(s) no período</span></div><div class="table-wrap"><table><thead><tr>${isAdmin()?`<th style="width:52px;padding:2px"><label class="chk-wrap"><input type="checkbox" id="chkTodasComissao" class="chk-comissao" title="Selecionar todas as pendentes" ${pendN>0&&selN===pendN?'checked':''} onchange="toggleSelTodasComissao(this.checked)"></label></th>`:''}<th>Data/Hora</th><th>Produto/Sabor</th><th>Qtd.</th><th>Local/Canal</th>${isAdmin()?'<th>Vendedor</th>':''}<th>Valor Total</th><th>% Comissão</th><th>Comissão R$</th><th>Repassar R$</th><th>Status</th>${isAdmin()?'<th style="text-align:right">Ação</th>':''}</tr></thead><tbody>${rows||`<tr><td colspan="${isAdmin()?12:9}" class="empty">Nenhuma venda no período selecionado.</td></tr>`}</tbody></table></div></div>`;
  };

  // ---------- Render central com bloqueio de rota e ações ----------
  window.render = async function(){
    if(!can(ROUTE)) ROUTE=allowedNav()[0]?.id||'produtos';
    window.renderNav();
    const title=titles[ROUTE]||['ERP',''];
    document.getElementById('pageTitle').textContent=title[0]; document.getElementById('pageSub').textContent=title[1];
    const c=document.getElementById('content'), actions=document.getElementById('topbarActions'); actions.innerHTML='';
    if(ROUTE==='dashboard'){ if(isAdmin()) actions.innerHTML=`<button class="btn btn-primary" onclick="persist('config','insumos','produtos','producoes','vendas','caixa');toast('Dados sincronizados com sucesso!','ok')">💾 Salvar informações</button>`; c.innerHTML=window.viewDashboard(); if(isAdmin()&&window.renderDashCharts) window.renderDashCharts(); }
    else if(ROUTE==='estoque'){ if(isAdmin()) actions.innerHTML=`<button class="btn btn-primary" onclick="modalInsumo()">+ Novo Insumo</button>`; c.innerHTML=window.viewEstoque(); }
    else if(ROUTE==='produtos'){ if(isAdmin()) actions.innerHTML=`<button class="btn btn-primary" onclick="modalProduto()">+ Novo Produto</button>`; c.innerHTML=window.viewProdutos(); }
    else if(ROUTE==='producao'){ if(isAdmin()) actions.innerHTML=`<button class="btn btn-primary" onclick="modalProducao()">+ Nova Produção</button>`; c.innerHTML=window.viewProducao(); }
    else if(ROUTE==='vendas'){ if(isAdmin()||isSeller()) actions.innerHTML=`<button class="btn btn-primary" onclick="modalVenda()">+ Nova Venda Manual</button>`; c.innerHTML=window.viewVendas(); }
    else if(ROUTE==='caixa'){ if(isAdmin()) actions.innerHTML=`<button class="btn btn-primary" onclick="modalCaixa()">+ Novo Lançamento</button>`; c.innerHTML=window.viewCaixa(); if(window.renderCaixaCharts) window.renderCaixaCharts(); }
    else if(ROUTE==='bipagem') c.innerHTML=window.viewBipagem();
    else if(ROUTE==='etiquetas') c.innerHTML=window.viewEtiquetas();
    else if(ROUTE==='relatorios') c.innerHTML=window.viewRelatorios();
    else if(ROUTE==='comissoes') { if(isAdmin() && !window.__usersCache.length) await carregarUsuarios(); c.innerHTML=window.viewComissoes(); }
    else if(ROUTE==='config') c.innerHTML=window.viewConfig() + (isAdmin() ? await window.viewUsuarios() : '');
  };

  ['salvarInsumo','deletarInsumo','salvarProducao','deletarProducao','salvarConfig','salvarCaixa','deletarCaixa'].forEach(fn=>{
    const original=window[fn];
    if(typeof original==='function') window[fn]=function(...args){ if(!isAdmin()){toast('Ação disponível somente para o administrador.','err');return;} return original(...args); };
  });
  const modalProdutoOriginal=window.modalProduto;
  window.modalProduto=function(id=null){ if(!isAdmin()) return toast('Produtos estão em modo somente leitura para este usuário.','err'); return modalProdutoOriginal(id); };
  const modalInsumoOriginal=window.modalInsumo;
  window.modalInsumo=function(id=null){ if(!isAdmin()) return toast('Ação disponível somente para o administrador.','err'); return modalInsumoOriginal(id); };
  const modalProducaoOriginal=window.modalProducao;
  window.modalProducao=function(id=null){ if(!isAdmin()) return toast('Ação disponível somente para o administrador.','err'); return modalProducaoOriginal(id); };
  const modalCaixaOriginal=window.modalCaixa;
  window.modalCaixa=function(id=null){ if(!isAdmin()) return toast('Ação disponível somente para o administrador.','err'); return modalCaixaOriginal(id); };

  const deletarVendaOriginal=window.deletarVenda;
  window.deletarVenda=function(id){ if(!isAdmin()&&!isSeller()) return toast('Ação disponível somente para usuários autorizados.','err'); const r=deletarVendaOriginal(id); excluirVendaFirestore(id); return r; };

  const persistOriginal = window.persist;
  window.persist = function(...keys){
    if(!isSeller()){ const r=persistOriginal(...keys); if(isAdmin() && (keys.includes('producoes') || keys.includes('produtos'))) publicarEtiquetasVendedor(); return r; }
    keys.forEach(k=>{
      if(k==='vendas') (DB.vendas||[]).filter(v=>v.vendedorUid===window.currentFirebaseUser?.uid).forEach(v=>salvarVendaFirestore(v));
      else localStorage.setItem('docemg_'+k, JSON.stringify(DB[k]));
    });
  };

  window.__rbacRoleText = ()=>ROLE_LABELS[window.currentUserRole]||window.currentUserRole;

  // CORREÇÃO 4: boot unificado, chamado pelo onAuthStateChanged do primeiro <script>
  window.__bootApp = async function(){
    const el = document.getElementById('currentUserEmail');
    if (el && window.currentFirebaseUser) {
      const roleLabel = ROLE_LABELS[window.currentUserRole] || window.currentUserRole;
      el.textContent = `${window.currentFirebaseUser.email || 'Usuário'} · ${roleLabel}`;
    }

    if (!can(ROUTE)) ROUTE = allowedNav()[0]?.id || 'produtos';

    if (typeof window.loadAll === 'function') {
      try { await window.loadAll(); } catch (e) { console.error('loadAll falhou:', e); }
    }

    if (isAdmin()) {
      try { await carregarUsuarios(); } catch {}
      try { await conciliarBaixasVendedores(); } catch (e) { console.error('Conciliação de vendas de vendedores falhou:', e); }
      publicarEtiquetasVendedor();
    }

    if (typeof window.render === 'function') await window.render();
  };

})();
</script>
<script>
  // Ocultar/mostrar o menu lateral (lembra a escolha neste navegador)
  (function(){
    function aplicar(oculto){ document.body.classList.toggle('sidebar-hidden', !!oculto); }
    window.toggleSidebar = function(){
      const oculto = !document.body.classList.contains('sidebar-hidden');
      aplicar(oculto);
      try { localStorage.setItem('docemg_sidebar_oculta', oculto ? '1' : '0'); } catch(e){}
    };
    try { aplicar(localStorage.getItem('docemg_sidebar_oculta') === '1'); } catch(e){}
  })();
</script>
</body>
</html>
