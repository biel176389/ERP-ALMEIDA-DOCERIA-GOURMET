window.fazerLogin = async (email, senha) => await signInWithEmailAndPassword(auth, email, senha);
window.fazerCadastro = async (email, senha) => await createUserWithEmailAndPassword(auth, email, senha);

  const provider = new GoogleAuthProvider();
  return await signInWithPopup(auth, provider);
};
window.fazerLogout = async () => await signOut(auth);

// CORREÇÃO 1: boot unificado — aguarda o RBAC do segundo <script> estar pronto
onAuthStateChanged(auth, async (user) => {
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('app');

  if (user) {
    window.currentFirebaseUser = user;
    try {
      const userRef = doc(db, 'usuarios', user.uid);
      const userSnap = await getDoc(userRef);
      let userData = userSnap.exists() ? userSnap.data() : {};

      // Registro automático do perfil em usuarios/{uid} no primeiro acesso
      // (e preenchimento do e-mail em perfis antigos que não o têm).
      // Sempre nasce como 'visualizador': só o admin promove depois.
      try {
        if (!userSnap.exists()) {
          const perfilNovo = {
            email: user.email || '',
            role: 'visualizador',
            comissaoPorcentagem: 20,
            criadoEm: serverTimestamp()
          };
          await setDoc(userRef, perfilNovo);
          userData = perfilNovo;
        } else if (!userData.email && user.email) {
          await setDoc(userRef, { email: user.email }, { merge: true });
          userData = { ...userData, email: user.email };
        }
      } catch (perfilError) {
        console.error('Falha ao registrar perfil em usuarios/' + user.uid + ':', perfilError);
      }
      const allowedRoles = ['admin', 'vendedor', 'visualizador'];
      // Normaliza (trim + minúsculas) para não cair no fallback por causa de
      // "Admin", "ADMIN " ou espaços digitados à mão no Firestore Console.
      const roleNormalizado = String(userData.role || '').trim().toLowerCase();
      window.currentUserRole = allowedRoles.includes(roleNormalizado) ? roleNormalizado : 'vendedor';
      window.currentUserComissao = Number(userData.comissaoPorcentagem ?? 20);
      window.currentUserProfile = {
        uid: user.uid,
        email: user.email || '',
        role: window.currentUserRole,
        comissaoPorcentagem: window.currentUserComissao
      };
    } catch (roleError) {
      console.error('Falha ao carregar perfil RBAC:', roleError);
      window.currentUserRole = 'vendedor';
      window.currentUserComissao = 20;
      window.currentUserProfile = { uid: user.uid, email: user.email || '', role: 'vendedor', comissaoPorcentagem: 20 };
    }
    if (loginScreen) loginScreen.style.display = 'none';
    if (appScreen) appScreen.style.display = 'flex';
    const userEmailEl = document.getElementById('currentUserEmail');
    if (userEmailEl) {
      const roleLabel = (window.__rbacRoleText && window.__rbacRoleText()) || window.currentUserRole;
      userEmailEl.textContent = `${user.email || 'Usuário'} · ${roleLabel}`;
    }

    // Aguarda o boot unificado do RBAC
    const boot = window.__bootApp;
    if (typeof boot === 'function') {
      await boot();
    } else {
      setTimeout(async () => {
        if (typeof window.__bootApp === 'function') await window.__bootApp();
      }, 50);
    }
  } else {
    if (appScreen) appScreen.style.display = 'none';
    if (loginScreen) loginScreen.style.display = 'flex';
    window.currentFirebaseUser = null;
    window.currentUserRole = 'vendedor';
    window.currentUserProfile = null;
  }
});

window.salvarDadosNoFirebase = async function (dados) {
  const colecao = 'erp_data';
  const chaves = ['config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog', 'etiquetaLayout'];
  await Promise.all(chaves.map(async (chave) => {
    await setDoc(doc(db, colecao, chave), {
      dados: dados[chave] ?? null,
      atualizadoEm: serverTimestamp()
    }, { merge: true });
  }));
};

window.firebasePronto = true;
console.log("Firebase e Autenticação inicializados com sucesso!");

  <script>
    /* ---------------- Auth UI Control ---------------- */
    let modoAuth = 'entrar';

    function alternarVisibilidadeSenha() {
      const input = document.getElementById('authSenha');
      const icon = document.getElementById('iconOlho');
      if (!input) return;
      const ficaraVisivel = input.type === 'password';
      input.type = ficaraVisivel ? 'text' : 'password';
      if (icon) {
        icon.innerHTML = ficaraVisivel
          ? '<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 4.24A11 11 0 0 1 12 4c7 0 11 7 11 7a13.3 13.3 0 0 1-3.1 3.8M6.1 6.1A13.4 13.4 0 0 0 1 11s4 7 11 7c1.5 0 2.87-.3 4.1-.8"/>'
          : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function alternarAbaLogin(modo) {
      modoAuth = modo;
      document.getElementById('tabEntrar').classList.toggle('active', modo === 'entrar');
      document.getElementById('tabCadastrar').classList.toggle('active', modo === 'cadastrar');
      document.getElementById('btnAuthSubmit').textContent = modo === 'entrar' ? 'Entrar' : 'Cadastrar';
    }

    async function submeterAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const senha = document.getElementById('authSenha').value;
      const msgErroAuth = (err) => ({
        'auth/email-already-in-use': 'Este e-mail já tem conta. Use a aba Entrar.',
        'auth/invalid-email': 'E-mail inválido.',
        'auth/weak-password': 'Senha fraca: use pelo menos 6 caracteres.',
        'auth/user-disabled': 'Esta conta foi bloqueada. Fale com o administrador.',
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/wrong-password': 'E-mail ou senha incorretos.',
        'auth/user-not-found': 'E-mail ou senha incorretos.',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco e tente de novo.',
        'auth/network-request-failed': 'Sem conexão com a internet.',
        'auth/operation-not-allowed': 'Cadastro por e-mail desativado no Firebase (Authentication → Sign-in method).'
      }[err.code] || (err.code || err.message));
      const btn = document.getElementById('btnAuthSubmit');
      if (btn) btn.disabled = true;
      try {
        if (modoAuth === 'cadastrar') {
          await window.fazerCadastro(email.trim(), senha);
          toast('Conta criada com sucesso!', 'ok');
        } else {
          await window.fazerLogin(email.trim(), senha);
          toast('Login realizado com sucesso!', 'ok');
        }
      } catch (err) {
        toast((modoAuth === 'cadastrar' ? 'Não foi possível criar a conta: ' : 'Não foi possível entrar: ') + msgErroAuth(err), 'err');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    async function submeterGoogle() {
      try {
        await window.fazerLoginGoogle();
        toast('Login Google realizado!', 'ok');
      } catch (err) {
        toast('Erro no login Google: ' + err.message, 'err');
      }
    }

    /* ---------------- helpers ---------------- */
    const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const fmtMoney = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('pt-BR'); };
    const fmtDateTime = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    const addDays = (iso, days) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + Number(days || 0)); return d.toISOString().slice(0, 10); };
    const isoToDatetimeLocal = (iso) => { if (!iso) return ''; const d = new Date(iso); const pad = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const datetimeLocalToISO = (val) => { if (!val) return nowISO(); return new Date(val).toISOString(); };
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c]));
    const slug = (s) => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]+/g, '').slice(0, 6) || 'PRD';

    function toast(msg, type) {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { 
        el.style.transition = 'opacity .25s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250); 
      }, 3200);
    }

    /* ---------------- storage ---------------- */
    const STORE_KEYS = ['config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog', 'etiquetaLayout'];
    let DB = {
      config: {}, insumos: [], produtos: [], producoes: [],
      vendas: [], caixa: [], scanlog: [], etiquetaLayout: {}
    };

    function defaultEtiquetaLayout() {
      const cfg = (typeof DB !== 'undefined' && DB.config) || {};
      return {
        larguraCm: 9, alturaCm: 4, orientacao: 'horizontal', gapMm: 3,
        tituloScale: 1,
        fundo: '#ffffff', corTexto: '#171717', corBorda: '#171717', corDestaque: '#7a1f3d',
        raioBorda: 12, espessuraBorda: 2, fonteTitulo: 'Fraunces', fonteCorpo: 'Manrope',
        mostrarLote: true, mostrarContato: true, mostrarInstagram: true, mostrarWhatsApp: true,
        textoContatoTitulo: '',
        whatsapp: cfg.whatsapp || '(32) 98448-1635',
        instagram: cfg.instagram || 'almeidadocergourmet',
      };
    }

    function defaultConfig() {
      const baseConfig = {
        nome: 'Almeida Doce Gourmet',
        whatsapp: '(32) 98448-1635',
        instagram: 'almeidadocergourmet',
        origem: 'Miraí - MG',
        cuidados: 'Manter em local fresco, seco e ao abrigo da luz solar.\nApós aberto, consumir em até 3 dias.\nEvitar armazenar próximo a produtos com cheiro forte.'
      };
      return {
        ...baseConfig,
        conteudoEtiqueta: `
${baseConfig.nome.toUpperCase()}
Origem: ${baseConfig.origem}

Contato:
• WhatsApp: ${baseConfig.whatsapp}
• Instagram: @${baseConfig.instagram}

CUIDADOS E CONSERVAÇÃO:
${baseConfig.cuidados}
`.trim()
      };
    }

    function seedData() {
      const leite = { id: uid(), nome: 'Leite Condensado', unidade: 'un', estoque: 24, estoqueMin: 6, custo: 5.20 };
      const choc = { id: uid(), nome: 'Chocolate em Pó', unidade: 'kg', estoque: 3.5, estoqueMin: 1, custo: 24.00 };
      const bolacha = { id: uid(), nome: 'Bolacha Maisena', unidade: 'kg', estoque: 5, estoqueMin: 2, custo: 9.80 };
      const insumos = [leite, choc, bolacha];
      const produtos = [{
        id: uid(),
        nome: 'Palha Italiana Tradicional',
        sku: 'PLH-TRAD',
        categoria: 'Doces',
        preco: 6.00,
        validadeDias: 15,
        rendimento: 1,
        estoque: 0,
        estoqueMin: 10,
        pesoMedio: 0.15,
        receita: [
          { insumoId: leite.id, qtd: 0.08 },
          { insumoId: choc.id, qtd: 0.03 },
          { insumoId: bolacha.id, qtd: 0.05 },
        ]
      }];
      return { insumos, produtos };
    }

    // CORREÇÃO 5: loadKey silencioso para erros esperados de permissão em RBAC restritivo
    async function loadKey(key, fallback) {
      const roleAtual = window.currentUserRole || 'vendedor';
      const isSeller = roleAtual === 'vendedor';
      const isViewer = roleAtual === 'visualizador';
      const restritoVendedor = ['config', 'insumos', 'producoes', 'caixa', 'etiquetaLayout'];
      const restritoViewer = ['caixa', 'vendas'];

      if ((isSeller && restritoVendedor.includes(key)) || (isViewer && restritoViewer.includes(key))) {
        try {
          const local = localStorage.getItem('docemg_' + key);
          return local != null ? JSON.parse(local) : fallback;
        } catch { return fallback; }
      }

      try {
        const snap = await window.getDoc(window.doc(window.db, 'erp_data', key));
        if (snap.exists() && snap.data().dados != null) {
          const dados = snap.data().dados;
          localStorage.setItem('docemg_' + key, JSON.stringify(dados));
          return dados;
        }
        const local = localStorage.getItem('docemg_' + key);
        return local != null ? JSON.parse(local) : fallback;
      } catch (e) {
        const msg = String(e?.code || e?.message || '');
        const isPermission = /permission|insufficient|denied/i.test(msg);
        if (!isPermission) {
          console.error('Erro ao carregar', key, e);
          toast('Erro ao carregar ' + key + ': ' + msg, 'err');
        }
        const local = localStorage.getItem('docemg_' + key);
        return local != null ? JSON.parse(local) : fallback;
      }
    }

          dados: value,
          atualizadoEm: window.serverTimestamp()
        }, { merge: true });

    const findInsumo = (id) => DB.insumos.find(i => i.id === id);

    function findItemByCode(code) {
      code = (code || '').trim().toUpperCase();
      if (!code) return null;
      for (const prod of DB.producoes) {
        const it = prod.itens.find(x => x.codigo.toUpperCase() === code);

    function custoInsumosPorUnidadeLocal(produto) {
      if (!produto || !Array.isArray(produto.receita) || !produto.receita.length) return null;
      const rendimento = Number(produto.rendimento);
      if (!Number.isFinite(rendimento) || rendimento <= 0) return null;
      let total = 0;
      for (const r of produto.receita) {
        const ins = findInsumo(r.insumoId);
        const qtd = Number(r.qtd);
        if (!ins || !Number.isFinite(qtd) || qtd < 0 || !Number.isFinite(Number(ins.custo)) || Number(ins.custo) < 0) return null;
        total += Number(ins.custo) * qtd;
      }
      return total / rendimento;
    }
    window.custoInsumosPorUnidade = function(produtoId) {
      return custoInsumosPorUnidadeLocal(findProduto(produtoId));
    };

    function validarDisponibilidadeInsumos(produto, qty) {
      if (!produto || !Number.isFinite(Number(qty)) || Number(qty) < 0) return 'Produto ou quantidade inválida.';
      const rendimento = Number(produto.rendimento);
      if (!Number.isFinite(rendimento) || !Number.isInteger(rendimento) || rendimento <= 0) return 'Informe um rendimento inteiro válido na ficha técnica do produto.';
      if (!Array.isArray(produto.receita) || produto.receita.length === 0) return 'Cadastre pelo menos um insumo na ficha técnica de ' + (produto.nome || 'este produto') + ' antes de registrar a produção.';
      for (const r of produto.receita) {
        const ins = findInsumo(r.insumoId);
        const qtd = Number(r.qtd);
        if (!ins) return 'Há um insumo ausente na ficha técnica de ' + produto.nome + '. Corrija a receita antes de produzir.';
        if (!Number.isFinite(qtd) || qtd < 0) return 'Há uma quantidade inválida na ficha técnica de ' + produto.nome + '.';
        const necessario = qtd * (Number(qty) / rendimento);
        const disponivel = Number(ins.estoque) || 0;
        if (necessario > disponivel + 0.0000001) {
          return 'Estoque insuficiente de ' + ins.nome + ': precisa de ' + necessario.toLocaleString('pt-BR', {maximumFractionDigits:4}) + ' ' + ins.unidade + ', disponível ' + disponivel.toLocaleString('pt-BR', {maximumFractionDigits:4}) + ' ' + ins.unidade + '.';
        }
      }
      return '';
    }
    window.validarDisponibilidadeInsumos = validarDisponibilidadeInsumos;

    function deduzInsumos(produto, qty) {
      const out = [];
      if (Number(qty) > 0) {
        const erro = validarDisponibilidadeInsumos(produto, qty);
        if (erro) { toast(erro, 'err'); return null; }
      }
      const rendimento = (produto.rendimento && produto.rendimento > 0) ? produto.rendimento : 1;
      const escala = qty / rendimento;
      (produto.receita || []).forEach(r => {
        const ins = findInsumo(r.insumoId);
        if (!ins) return;
        const amount = Number(r.qtd) * escala;
        ins.estoque = Math.round((Number(ins.estoque || 0) - amount) * 10000) / 10000;
        out.push({ insumo: ins, deducted: amount });
      });
      return out;
    }

    function periodDays(n) {
      const out = [];
      for (let i = n - 1; i >= 0; i--) { out.push(addDays(todayISO(), -i)); }

    function vendasFaturamento(v) { return (Array.isArray(v && v.itens) ? v.itens : []).reduce((s, i) => s + (Number(i && i.preco) || 0) * (Number(i && i.qty) || 0), 0); }

    function vendaCusto(v) {
      if (window.saleCost) return window.saleCost(v);
      let total = 0;
      for (const it of (v.itens || [])) {
        const p = findProduto(it.produtoId);
        const unit = custoInsumosPorUnidadeLocal(p);
        if (unit === null) return null;
        total += unit * (Number(it.qty) || 0);
      }
      return total;
    }

    function vendaDia(v) { return (v.data || '').slice(0, 10); }

    // ---------- Filtro de período compartilhado (Dashboard e Caixa) ----------
    const FILTROS_PERIODO = [['hoje','Hoje'],['7','7 dias'],['30','1 Mês'],['custom','Personalizado']];
    const PERIODO = { dash: { f: '7', de: '', ate: '' }, caixa: { f: '30', de: '', ate: '' } };
    const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    function periodDaysFiltro(st, minData) {
      const hoje = todayISO(); let ini = hoje, fim = hoje; const f = st.f;
      if (f === 'hoje') {}
      else if (/^\d+$/.test(f)) ini = addDays(hoje, -(parseInt(f, 10) - 1));
      else if (f === 'mes') ini = hoje.slice(0, 8) + '01';
      else if (f === 'mes_anterior') { const y = +hoje.slice(0, 4), m = +hoje.slice(5, 7); ini = isoLocal(new Date(y, m - 2, 1)); fim = isoLocal(new Date(y, m - 1, 0)); }
      else if (f === 'tudo') ini = (minData && minData < hoje) ? minData : hoje;
      else if (f === 'custom') { ini = st.de || hoje.slice(0, 8) + '01'; fim = st.ate || hoje; if (ini > fim) { const t = ini; ini = fim; fim = t; } }
      const MAX = 731; // limite de segurança: ~2 anos de pontos nos gráficos
      const total = Math.round((new Date(fim + 'T00:00:00') - new Date(ini + 'T00:00:00')) / 86400000) + 1;
      if (total > MAX) ini = addDays(fim, -(MAX - 1));
      const out = []; let d = ini;
      while (d <= fim && out.length < MAX) { out.push(d); d = addDays(d, 1); }
      return out;
    }
    function periodoLabel(st, days) {
      if (st.f === 'hoje') return 'hoje';
      if (/^\d+$/.test(st.f)) return 'últimos ' + st.f + ' dias';
      return days.length ? fmtDate(days[0]) + ' a ' + fmtDate(days[days.length - 1]) : '';
    }
    function minDataVendas() { return (DB.vendas || []).reduce((m, v) => { const d = vendaDia(v); return d && (!m || d < m) ? d : m; }, ''); }
    function filtroPeriodoHtml(key) {
      const st = PERIODO[key];
      const btns = FILTROS_PERIODO.map(([id, rot]) => `<button class="pill-tab ${st.f === id ? 'active' : ''}" onclick="setPeriodoFiltro('${key}','${id}')">${rot}</button>`).join('');
      const custom = st.f === 'custom' ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;justify-content:flex-end"><label style="font-size:13px">De <input type="date" class="input" style="width:auto;display:inline-block" value="${st.de || ''}" onchange="setPeriodoData('${key}','de',this.value)"></label><label style="font-size:13px">Até <input type="date" class="input" style="width:auto;display:inline-block" value="${st.ate || ''}" onchange="setPeriodoData('${key}','ate',this.value)"></label></div>` : '';

    }
    window.setPeriodoFiltro = function (key, f) {

    function viewDashboard() {
      const hoje = todayISO();
      const mesRef = hoje.slice(0, 7);
      const vendasMes = DB.vendas.filter(v => vendaDia(v).slice(0, 7) === mesRef);
      const faturamentoMes = vendasMes.reduce((s, v) => s + vendasFaturamento(v), 0);
      const custosMesLista = vendasMes.map(v => vendaCusto(v));
      const custosMesCompletos = custosMesLista.every(v => Number.isFinite(v));
      const vendasSemCustoMes = custosMesLista.filter(v => !Number.isFinite(v)).length;
      const custoMes = custosMesLista.reduce((s, v) => s + (Number.isFinite(v) ? v : 0), 0);
      const comissaoMes = vendasMes.reduce((s, v) => s + (window.saleCommission ? window.saleCommission(v) : 0), 0);
      const lucroMes = custosMesCompletos ? faturamentoMes - custoMes - comissaoMes : null;
      const vendasHoje = DB.vendas.filter(v => vendaDia(v) === hoje);
      const itensHoje = vendasHoje.reduce((s, v) => s + (Array.isArray(v.itens) ? v.itens : []).reduce((a, i) => a + (Number(i && i.qty) || 0), 0), 0);
      const lowInsumos = DB.insumos.filter(insumoLowStock).length;
      const lowProdutos = DB.produtos.filter(produtoLowStock).length;

      const days = periodDaysFiltro(PERIODO.dash, minDataVendas());
      const lblPer = periodoLabel(PERIODO.dash, days);
      const dayLabels = days.map(d => fmtDate(d).slice(0, 5));
      const vendasPorDia = days.map(d => DB.vendas.filter(v => vendaDia(v) === d));
      const dayTotals = vendasPorDia.map(lista => lista.reduce((s, v) => s + vendasFaturamento(v), 0));
      const dayCustosLista = vendasPorDia.map(lista => lista.map(v => vendaCusto(v)));
      const dayCustosCompletos = dayCustosLista.map(lista => lista.every(v => Number.isFinite(v)));
      const dayCustos = dayCustosLista.map(lista => lista.reduce((s, v) => s + (Number.isFinite(v) ? v : 0), 0));
      const dayComissoes = vendasPorDia.map(lista => lista.reduce((s, v) => s + (window.saleCommission ? window.saleCommission(v) : 0), 0));
      const dayLucros = dayTotals.map((t, i) => dayCustosCompletos[i] ? t - dayCustos[i] - dayComissoes[i] : null);
      const dayTicket = vendasPorDia.map((lista, i) => lista.length ? dayTotals[i] / lista.length : 0);
      const dayMargem = dayTotals.map((t, i) => t > 0 && Number.isFinite(dayLucros[i]) ? (dayLucros[i] / t) * 100 : null);
      const temVendasPeriodo = dayTotals.some(v => v > 0);

      const vendasPeriodoFlat = vendasPorDia.flat();
      const vendasBipagem = vendasPeriodoFlat.filter(v => v.origem === 'bipagem').length;
      const vendasManual = vendasPeriodoFlat.length - vendasBipagem;

      const porProduto = {};
      vendasPeriodoFlat.forEach(v => (v.itens || []).forEach(it => { porProduto[it.produtoId] = (porProduto[it.produtoId] || 0) + (Number(it.qty) || 0); }));
      const topProdutos = Object.entries(porProduto).sort((a, b) => b[1] - a[1]).slice(0, 5)
        .map(([id, qty]) => ({ nome: (findProduto(id) || {}).nome || '—', qty }));

      window.__dash = { dayLabels, dayTotals, dayCustos, dayLucros, dayTicket, dayMargem, topProdutos, vendasManual, vendasBipagem };

      return `
      <div class="grid grid-4">
        <div class="card stat"><div class="label">Faturamento (mês)</div><div class="value">${fmtMoney(faturamentoMes)}</div><div class="delta">${vendasMes.length} venda(s) no mês</div></div>
        <div class="card stat"><div class="label">Resultado parcial (mês)</div><div class="value">${lucroMes === null ? '—' : fmtMoney(lucroMes)}</div><div class="delta">${custosMesCompletos ? 'Insumos: ' + fmtMoney(custoMes) : 'Custo conhecido: ' + fmtMoney(custoMes) + ' · ' + vendasSemCustoMes + ' venda(s) sem custo completo'} · comissões: ${fmtMoney(comissaoMes)}. Não inclui as demais despesas.</div></div>
        <div class="card stat"><div class="label">Itens vendidos hoje</div><div class="value">${itensHoje}</div><div class="delta">${vendasHoje.length} venda(s) hoje</div></div>

        });
      }

      const ticketCanvas = document.getElementById('chartTicket');
      if (ticketCanvas) {
        destroyDashChart('ticket');

              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="salvarInsumo('${id || ''}')">Salvar</button>
            </div>

        </div>

    function salvarInsumo(id) {
      const nome = document.getElementById('insNome').value.trim();
      if (!nome) return toast('Informe o nome do insumo', 'err');
      const custoRaw = document.getElementById('insCusto').value;
      const estoqueRaw = document.getElementById('insEstoque').value;
      const minimoRaw = document.getElementById('insEstoqueMin').value;
      const custo = custoRaw === '' ? NaN : Number(custoRaw);
      const estoque = estoqueRaw === '' ? NaN : Number(estoqueRaw);
      const estoqueMin = minimoRaw === '' ? NaN : Number(minimoRaw);
      if (!Number.isFinite(custo) || custo < 0) return toast('Informe um custo unitário válido, igual ou maior que zero.', 'err');
      if (!Number.isFinite(estoque) || estoque < 0) return toast('O estoque atual não pode ser negativo.', 'err');
      if (!Number.isFinite(estoqueMin) || estoqueMin < 0) return toast('O estoque mínimo não pode ser negativo.', 'err');
      const ins = {
        id: id || uid(), nome, unidade: document.getElementById('insUnidade').value,
        custo, estoque, estoqueMin
      };
      if (id) {
        const idx = DB.insumos.findIndex(i => i.id === id);
        if (idx !== -1) DB.insumos[idx] = ins;
      } else {
        DB.insumos.push(ins);
      }
      persist('insumos');
      fecharModalDirect();
      render();
      toast('Insumo salvo!', 'ok');
    }

    function deletarInsumo(id) {
      const usadoEm = (DB.produtos || []).filter(p => (p.receita || []).some(r => r.insumoId === id));
      if (usadoEm.length) return toast('Este insumo está em ficha técnica de ' + usadoEm.map(p => p.nome).join(', ') + '. Remova ou substitua-o nas receitas antes de excluir para não distorcer os custos.', 'err');
      if (!confirm('Deseja excluir este insumo?')) return;
      DB.insumos = DB.insumos.filter(i => i.id !== id);
      persist('insumos');
      render();
      toast('Insumo removido!', 'ok');
    }

              <button class="icon-btn" onclick="deletarProduto('${p.id}')">🗑️</button>

      return `

          <div class="table-wrap">
            <table>
              <thead>
                <tr>

                  <th>Categoria</th>
                  <th>Preço Venda</th>
                  <th>Custo Ficha</th>

              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function salvarProduto(id) {
      const nome = document.getElementById('prdNome').value.trim();
      if (!nome) return toast('Informe o nome do produto', 'err');
      const precoRaw = document.getElementById('prdPreco').value;
      const preco = precoRaw === '' ? NaN : Number(precoRaw);
      const validadeRaw = document.getElementById('prdValidade').value;
      const validadeDias = validadeRaw === '' ? NaN : Number(validadeRaw);
      const estoqueRaw = document.getElementById('prdEstoque').value;
      const estoque = estoqueRaw === '' ? 0 : Number(estoqueRaw);
      const estoqueMinRaw = document.getElementById('prdEstoqueMin').value;
      const estoqueMin = estoqueMinRaw === '' ? 0 : Number(estoqueMinRaw);
      const rendimentoRaw = document.getElementById('prdRendimento').value;
      const rendimento = rendimentoRaw === '' ? NaN : Number(rendimentoRaw);
      if (!Number.isFinite(preco) || preco < 0) return toast('Informe um preço de venda válido, igual ou maior que zero.', 'err');
      if (!Number.isInteger(validadeDias) || validadeDias < 1) return toast('Informe uma validade inteira de pelo menos 1 dia.', 'err');
      if (!Number.isInteger(estoque) || estoque < 0) return toast('O estoque do produto deve ser um número inteiro, igual ou maior que zero.', 'err');
      if (!Number.isInteger(estoqueMin) || estoqueMin < 0) return toast('O estoque mínimo deve ser um número inteiro, igual ou maior que zero.', 'err');
      if (!Number.isInteger(rendimento) || rendimento < 1) return toast('Informe um rendimento inteiro de pelo menos 1 unidade.', 'err');
      const prod = {
        id: id || uid(),
        nome,
        sku: document.getElementById('prdSku').value.trim() || slug(nome),
        preco,
        validadeDias,
        estoque,
        estoqueMin,
        rendimento,
        receita: (window.__activeRecipe || []).filter(r => r.insumoId && Number(r.qtd) > 0)
      };
      if (id) {
        const idx = DB.produtos.findIndex(p => p.id === id);
        if (idx !== -1) DB.produtos[idx] = prod;
      } else {
        DB.produtos.push(prod);
      }
      persist('produtos');
      fecharModalDirect();
      render();
      toast('Produto salvo!', 'ok');
    }

    function atualizarValidadeProducao() {
      const fabEl = document.getElementById('prodDataFab');
      const valEl = document.getElementById('prodDataVal');
      const prodSelEl = document.getElementById('prodProdutoId');
      if (!fabEl || !valEl) return;
      const fab = fabEl.value || todayISO();
      const produtoSel = prodSelEl ? findProduto(prodSelEl.value) : null;
      const dias = (produtoSel && produtoSel.validadeDias > 0) ? produtoSel.validadeDias : DIAS_VALIDADE_PADRAO;
      valEl.value = addDays(fab, dias);
    }

    function modalProducao(id = null) {
      const prod = DB.producoes.find(p => p.id === id) || {
        produtoId: DB.produtos[0]?.id || '',
        quantidade: 10,
        dataFabricacao: todayISO(),
        dataValidade: ''
      };
      const dataFabInicial = prod.dataFabricacao || todayISO();
      const produtoInicial = findProduto(prod.produtoId);
      const diasInicial = (produtoInicial && produtoInicial.validadeDias > 0) ? produtoInicial.validadeDias : DIAS_VALIDADE_PADRAO;
      const dataValInicial = prod.dataValidade || addDays(dataFabInicial, diasInicial);

      const content = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal">
            <div class="modal-head">
              <h3>${id ? 'Editar Produção' : 'Registrar Produção'}</h3>
              <button class="modal-close" onclick="fecharModalDirect()">×</button>
            </div>
            <div class="modal-body">
              <div class="field">
                <label>Produto</label>
                <select id="prodProdutoId" class="input" onchange="atualizarValidadeProducao()">
                  ${DB.produtos.map(p => `<option value="${p.id}" ${p.id === prod.produtoId ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Quantidade Produzida</label>
                <input type="number" min="1" step="1" id="prodQtd" class="input" value="${prod.quantidade}">
              </div>
              <div class="field-row">
                <div class="field">
                  <label>Data Fabricação</label>
                  <input type="date" id="prodDataFab" class="input" value="${dataFabInicial}" oninput="atualizarValidadeProducao()">
                </div>
                <div class="field">
                  <label>Data Validade</label>
                  <input type="date" id="prodDataVal" class="input" value="${dataValInicial}">
                </div>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="salvarProducao('${id || ''}')">Confirmar Produção</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalRoot').innerHTML = content;
    }

    function salvarProducao(id = '') {
      const produtoId = document.getElementById('prodProdutoId').value;
      const qtdRaw = document.getElementById('prodQtd').value;
      const qtd = qtdRaw === '' ? NaN : Number(qtdRaw);
      const dataFab = document.getElementById('prodDataFab').value || todayISO();
      const produto = findProduto(produtoId);
      if (!produto || !Number.isInteger(qtd) || qtd <= 0) return toast('Insira uma quantidade inteira maior que zero.', 'err');

      const dataVal = document.getElementById('prodDataVal').value || addDays(dataFab, produto.validadeDias);
      const producaoExistente = id ? DB.producoes.find(p => p.id === id) : null;
      let qtdNovaParaValidar = qtd;
      if (producaoExistente && producaoExistente.produtoId === produtoId) {
        qtdNovaParaValidar = Math.max(0, qtd - (Number(producaoExistente.quantidade) || 0));
      }
      if (qtdNovaParaValidar > 0 && window.validarDisponibilidadeInsumos) {
        const erroInsumos = window.validarDisponibilidadeInsumos(produto, qtdNovaParaValidar);
        if (erroInsumos) return toast(erroInsumos, 'err');
      }

      if (id) {
        const prod = DB.producoes.find(p => p.id === id);
        if (prod) {
          const produtoAnt = findProduto(prod.produtoId);
          const itens = prod.itens || [];
          const disponiveis = itens.filter(bipItemDisponivel);
          const usados = itens.length - disponiveis.length;

          if (prod.produtoId !== produtoId) {
            if (usados > 0) return toast('Não é possível trocar o produto: ' + usados + ' etiqueta(s) deste lote já foram baixadas (vendidas, doadas ou perdidas).', 'err');
            if (!confirm('Trocar o produto gera novos códigos de etiqueta para este lote. As etiquetas já impressas deixam de valer e precisam ser reimpressas. Continuar?')) return;
            if (produtoAnt) {
              produtoAnt.estoque = Math.max(0, produtoAnt.estoque - prod.quantidade);
              deduzInsumos(produtoAnt, -prod.quantidade);
            }
            produto.estoque += qtd;
            deduzInsumos(produto, qtd);
            prod.itens = Array.from({ length: qtd }, (_, i) => ({ codigo: `${produto.sku}-${prod.lote}-${i + 1}`, status: 'disponivel' }));
          } else {
            const diff = qtd - prod.quantidade;
            if (diff < 0 && disponiveis.length < -diff) {
              return toast('Este lote só tem ' + disponiveis.length + ' etiqueta(s) disponível(is); não dá para reduzir para ' + qtd + '.', 'err');
            }
            if (diff > 0) {
              const max = itens.reduce((m, it) => Math.max(m, parseInt(String(it.codigo).split('-').pop(), 10) || 0), 0);
              for (let i = 1; i <= diff; i++) itens.push({ codigo: `${produto.sku}-${prod.lote}-${max + i}`, status: 'disponivel' });
            } else if (diff < 0) {
              let resta = -diff;
              for (let i = itens.length - 1; i >= 0 && resta > 0; i--) {
                if (bipItemDisponivel(itens[i])) { itens.splice(i, 1); resta--; }
              }
            }
            prod.itens = itens;
            if (diff !== 0) {
              produto.estoque = Math.max(0, produto.estoque + diff);
              deduzInsumos(produto, diff);
            }
          }
          prod.quantidade = qtd;
          prod.produtoId = produtoId;
          prod.dataFabricacao = dataFab;
          prod.dataValidade = dataVal;
        }
      } else {
        const lote = 'L' + Date.now().toString().slice(-6);
        const itens = [];
        for (let i = 1; i <= qtd; i++) {
          itens.push({
            codigo: `${produto.sku}-${lote}-${i}`,
            status: 'disponivel'
          });
        }

        deduzInsumos(produto, qtd);

        produto.estoque += qtd;

        DB.producoes.push({
          id: uid(),
          lote,
          produtoId,
          quantidade: qtd,
          dataFabricacao: dataFab,
          dataValidade: dataVal,
          itens
        });
      }

      persist('produtos', 'producoes', 'insumos');
      fecharModalDirect();
      render();
      toast(id ? 'Produção atualizada com sucesso!' : 'Lote produzido com sucesso!', 'ok');
    }

    function deletarProducao(id) {
      const prod = DB.producoes.find(p => p.id === id);
      if (!prod) return;
      const disp = Array.isArray(prod.itens) ? prod.itens.filter(bipItemDisponivel).length : prod.quantidade;
      const usados = Array.isArray(prod.itens) ? prod.itens.length - disp : 0;
      const msg = 'Deseja excluir este registro de produção?\n\n' + disp + ' unidade(s) ainda disponíveis serão retiradas do estoque.' +
        (usados > 0 ? '\n' + usados + ' já baixada(s) (vendas, doações ou perdas) não serão descontadas de novo.' : '');
      if (!confirm(msg)) return;
      const produto = findProduto(prod.produtoId);
      if (produto) produto.estoque = Math.max(0, produto.estoque - disp);
      DB.producoes = DB.producoes.filter(p => p.id !== id);
      persist('produtos', 'producoes');
      render();
      toast('Registro de produção removido!', 'ok');
    }

    function viewVendas() {
      const lista = DB.vendas.slice().sort((a, b) => (a.data < b.data ? 1 : (a.data > b.data ? -1 : 0)));
      const rows = lista.map(v => `
        <tr>
          <td><span class="mono">${fmtDateTime(v.data)}</span></td>
          <td>${(Array.isArray(v.itens) ? v.itens : []).map(i => `${i.qty}x ${(findProduto(i.produtoId)||{}).nome||'—'}`).join(', ')}${etiquetasDaVenda(v)}</td>
          <td><b>${fmtMoney(vendasFaturamento(v))}</b></td>
          <td>${v.origem === 'bipagem' ? '<span class="badge badge-muted">Bipagem</span>' : '<span class="badge badge-muted">Manual</span>'}</td>
          <td style="text-align:right;">
            ${(window.currentUserRole === 'vendedor' && v.baixaPendente === false) ? '' : `<button class="icon-btn" onclick="modalVenda('${v.id}')">✏️ Edit</button>
            <button class="icon-btn" onclick="deletarVenda('${v.id}')">🗑️</button>`}
          </td>
        </tr>
      `).join('');

      return `
        <div class="card card-pad">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Itens</th>
                  <th>Total Venda</th>
                  <th>Origem</th>
                  <th style="text-align:right;">Ações</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows : '<tr><td colspan="5" class="empty">Nenhuma venda realizada.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // Campo "Vendedor" (somente administrador): padrão = usuário logado
    function campoVendedorVenda(venda) {
      if (window.currentUserRole !== 'admin' || !window.destinosVenda) return '';
      const lista = window.destinosVenda().slice();
      const meuUid = window.currentFirebaseUser?.uid || '';
      const atual = venda ? (venda.vendedorUid || '') : meuUid;
      if (atual && !lista.some(u => u.uid === atual)) lista.push({ uid: atual, email: venda?.vendedorEmail || atual, role: 'vendedor' });
      const bloqueado = !!venda && venda.statusAcerto === 'quitado';
      const semDono = atual === '' ? '<option value="" selected>— sem vendedor definido —</option>' : '';
      const opts = lista.map(u => `<option value="${esc(u.uid)}" ${u.uid === atual ? 'selected' : ''}>${esc(u.email || u.uid)}${u.uid === meuUid ? ' (você)' : ''}</option>`).join('');
      const aviso = bloqueado ? '<p class="hint" style="margin-top:6px">Venda já quitada: desfaça a quitação em Comissões / Acertos para trocar o vendedor.</p>' : '';
      return `<div class="field"><label>Vendedor</label><select id="vendaVendedor" class="input" ${bloqueado ? 'disabled' : ''}>${semDono}${opts}</select>${aviso}</div>`;
    }

    function modalVenda(id = null) {
      const venda = id ? DB.vendas.find(v => v.id === id) : null;
      const item = venda ? venda.itens[0] : null;
      const content = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal">
            <div class="modal-head">
              <h3>${venda ? 'Editar Venda' : 'Nova Venda Manual'}</h3>
              <button class="modal-close" onclick="fecharModalDirect()">×</button>
            </div>
            <div class="modal-body">
              ${venda && venda.codigo ? `<p class="hint">Vinculada ao código de etiqueta <b>${esc(venda.codigo)}</b>. Editar aqui corrige os dados da venda; para liberar o item novamente, exclua a venda em vez de editá-la.</p>` : ''}
              <div class="field">
                <label>Produto</label>
                <select id="vendaProdutoId" class="input" onchange="atualizarEtiquetasVenda()">
                  ${DB.produtos.map(p => `<option value="${p.id}" ${item && item.produtoId === p.id ? 'selected' : ''}>${esc(p.nome)} - ${fmtMoney(p.preco)}</option>`).join('')}
                </select>
              </div>
              ${venda ? `<div class="field-row">
                <div class="field">
                  <label>Quantidade</label>
                  <input type="number" min="1" step="1" id="vendaQtd" class="input" value="${item ? item.qty : 1}">
                </div>
                <div class="field">
                  <label>Data/Hora</label>
                  <input type="datetime-local" id="vendaDataHora" class="input" value="${isoToDatetimeLocal(venda ? venda.data : nowISO())}">
                </div>
              </div>
              <div class="field">
                <label>Local / Canal de Venda</label>
                <input type="text" id="vendaCanal" class="input" value="${esc(venda?.localCanal || 'Venda de campo')}" placeholder="Ex.: Praça, porta a porta, evento...">
              </div>` : ''}
              ${campoVendedorVenda(venda)}
              ${caixaEtiquetasVenda(venda)}
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="salvarVenda('${id || ''}')">${venda ? 'Salvar Alterações' : 'Finalizar Venda'}</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalRoot').innerHTML = content;
    }

    // Escolha opcional das etiquetas na venda manual
    function etiquetasParaVenda(produtoId, venda) {
      const meus = new Set(venda && Array.isArray(venda.etiquetasBaixadas) ? venda.etiquetasBaixadas : []);
      const out = [];
      (DB.producoes || []).filter(pr => pr.produtoId === produtoId)
        .slice().sort((a, b) => String(a.dataValidade || '').localeCompare(String(b.dataValidade || '')))
        .forEach(pr => (pr.itens || []).forEach(it => {
          if (!it.status || it.status === 'disponivel' || meus.has(it.codigo)) out.push({ it, pr, meu: meus.has(it.codigo) });
        }));
      return out;
    }
    function listaEtiquetasVenda(produtoId, venda) {
      const lista = etiquetasParaVenda(produtoId, venda);
      if (!lista.length) return '<p class="hint">Sem etiquetas disponíveis para este produto.</p>';
      return '<div style="max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px;">' + lista.map(e =>
        `<label style="display:flex;gap:8px;align-items:center;padding:4px 2px;margin:0;text-transform:none;cursor:pointer;"><input type="checkbox" class="chk-etq-venda" value="${esc(e.it.codigo)}" ${e.meu ? 'checked' : ''} onchange="contarEtiquetasVenda()" style="width:18px;height:18px;accent-color:var(--wine,#7a1f3d);"><span class="mono">${esc(e.it.codigo)}</span><span class="hint">val. ${fmtDate(e.pr.dataValidade)}</span></label>`
      ).join('') + '</div>';
    }
    function caixaEtiquetasVenda(venda) {
      if (venda && (venda.origem === 'bipagem' || !Array.isArray(venda.etiquetasBaixadas))) return '';
      const produtoId = venda ? (venda.itens[0] || {}).produtoId : ((DB.produtos[0] || {}).id || '');
      return `<div class="field" id="vendaEtiquetasBox" data-venda="${venda ? esc(venda.id) : ''}">
        <label>Etiquetas vendidas</label>
        <div id="vendaEtiquetasLista">${listaEtiquetasVenda(produtoId, venda)}</div>
      </div>`;
    }
    function atualizarEtiquetasVenda() {
      const box = document.getElementById('vendaEtiquetasBox');
      const sel = document.getElementById('vendaProdutoId');
      if (!box || !sel) return;
      const venda = box.dataset.venda ? DB.vendas.find(v => v.id === box.dataset.venda) : null;
      document.getElementById('vendaEtiquetasLista').innerHTML = listaEtiquetasVenda(sel.value, venda);
    }
    function contarEtiquetasVenda() {
      const n = document.querySelectorAll('.chk-etq-venda:checked').length;
      const q = document.getElementById('vendaQtd');
      if (q && n > 0) q.value = n;
    }
    function etiquetasDaVenda(v) {
      const c = (v.origem === 'bipagem' && v.codigo) ? [v.codigo] : (Array.isArray(v.etiquetasBaixadas) ? v.etiquetasBaixadas : []);
      if (!c.length) return '';
      const txt = c.length > 3 ? c.slice(0, 3).join(', ') + ' +' + (c.length - 3) : c.join(', ');
      return `<br><small class="mono" style="opacity:.65;">${esc(txt)}</small>`;
    }

    // Vendas manuais também dão baixa nas etiquetas (as de validade mais próxima primeiro)
    function baixarEtiquetasDoProduto(produtoId, qty, escolhidas) {
      const cods = [];
      (escolhidas || []).forEach(c => {
        if (cods.length >= qty) return;
        const a = findItemByCode(c);
        if (a && a.item && a.producao.produtoId === produtoId && (!a.item.status || a.item.status === 'disponivel')) {
          a.item.status = 'vendido'; cods.push(a.item.codigo);
        }
      });
      const prods = (DB.producoes || []).filter(pr => pr.produtoId === produtoId)
        .slice().sort((x, y) => String(x.dataValidade || '').localeCompare(String(y.dataValidade || '')));
      for (const pr of prods) {
        for (const it of (pr.itens || [])) {
          if (cods.length >= qty) return cods;
          if (!it.status || it.status === 'disponivel') { it.status = 'vendido'; cods.push(it.codigo); }
        }
      }
      return cods;
    }
    function devolverEtiquetas(cods) {
      (cods || []).forEach(c => { const a = findItemByCode(c); if (a && a.item) a.item.status = 'disponivel'; });
    }

    function salvarVenda(id) {
      const produtoId = document.getElementById('vendaProdutoId').value;
      const escolhidas = [...document.querySelectorAll('.chk-etq-venda:checked')].map(c => c.value);
      const qtdEl = document.getElementById('vendaQtd');
      const qty = qtdEl ? (qtdEl.value === '' ? NaN : Number(qtdEl.value)) : (escolhidas.length || 1);
      const dataHoraEl = document.getElementById('vendaDataHora');
      const produto = findProduto(produtoId);
      if (!produto || !Number.isInteger(qty) || qty <= 0) return toast('Informe um produto e uma quantidade inteira maior que zero.', 'err');

      if (qtdEl && escolhidas.length && escolhidas.length !== qty) return toast('Você marcou ' + escolhidas.length + ' etiqueta(s), mas a quantidade é ' + qty + '. Ajuste a quantidade ou as etiquetas marcadas.', 'err');

      const selVendedor = document.getElementById('vendaVendedor');
      const destUid = selVendedor && !selVendedor.disabled ? selVendedor.value : '';
      const destUser = destUid && window.destinosVenda ? window.destinosVenda().find(u => u.uid === destUid) : null;

      if (id) {
        const idx = DB.vendas.findIndex(v => v.id === id);
        if (idx === -1) return toast('Venda não encontrada', 'err');
        const vendaAntiga = DB.vendas[idx];
        const itemAntigo = (vendaAntiga.itens || [])[0] || {};
        const creditoEstoque = itemAntigo.produtoId === produtoId ? (Number(itemAntigo.qty) || 0) : 0;
        if ((Number(produto.estoque) || 0) + creditoEstoque < qty) return toast('Estoque insuficiente de ' + produto.nome + '. Disponível para esta operação: ' + ((Number(produto.estoque) || 0) + creditoEstoque) + ' unidade(s).', 'err');
        const rastreiaEtiquetas = vendaAntiga.origem !== 'bipagem' && Array.isArray(vendaAntiga.etiquetasBaixadas);
        if (rastreiaEtiquetas) devolverEtiquetas(vendaAntiga.etiquetasBaixadas);
        (Array.isArray(vendaAntiga.itens) ? vendaAntiga.itens : []).forEach(it => {
          const p = findProduto(it.produtoId);
          if (p) p.estoque = (Number(p.estoque) || 0) + (Number(it.qty) || 0);
        });
        produto.estoque = (Number(produto.estoque) || 0) - qty;

        const novasEtiquetas = rastreiaEtiquetas ? baixarEtiquetasDoProduto(produtoId, qty, escolhidas) : null;
        const trocouVendedor = !!destUser && destUser.uid !== (vendaAntiga.vendedorUid || '');
        const mesmoProduto = itemAntigo.produtoId === produtoId;
        const itemAtualizado = { produtoId, qty, preco: mesmoProduto ? Number(itemAntigo.preco) : Number(produto.preco) };
        if (mesmoProduto && Object.prototype.hasOwnProperty.call(itemAntigo, 'custoUnitarioInsumos')) itemAtualizado.custoUnitarioInsumos = itemAntigo.custoUnitarioInsumos;
        else if (!mesmoProduto) itemAtualizado.custoUnitarioInsumos = window.custoInsumosPorUnidade ? window.custoInsumosPorUnidade(produtoId) : null;
        DB.vendas[idx] = {
          ...vendaAntiga,
          data: dataHoraEl && dataHoraEl.value ? datetimeLocalToISO(dataHoraEl.value) : vendaAntiga.data,
          itens: [itemAtualizado],
          ...(novasEtiquetas ? { etiquetasBaixadas: novasEtiquetas } : {}),
          localCanal: document.getElementById('vendaCanal')?.value?.trim() || vendaAntiga.localCanal || 'Venda de campo',
          vendedorUid: trocouVendedor ? destUser.uid : (vendaAntiga.vendedorUid || window.currentFirebaseUser?.uid || ''),
          vendedorEmail: trocouVendedor ? (destUser.email || '') : (vendaAntiga.vendedorEmail || window.currentFirebaseUser?.email || ''),
          ...(trocouVendedor ? { comissaoPorcentagem: Number(window.taxaComissaoUsuario(destUser)) } : (vendaAntiga.comissaoPorcentagem !== undefined && vendaAntiga.comissaoPorcentagem !== null ? { comissaoPorcentagem: Number(vendaAntiga.comissaoPorcentagem) } : {})),
          statusAcerto: vendaAntiga.statusAcerto || 'pendente'
        };
        if (window.salvarVendaFirestore) window.salvarVendaFirestore(DB.vendas[idx]);

        persist('produtos', 'vendas', 'producoes');
        fecharModalDirect();
        render();
        toast('Venda atualizada com sucesso!', 'ok');
        return;
      }

      if ((Number(produto.estoque) || 0) < qty) return toast('Estoque insuficiente de ' + produto.nome + '. Disponível: ' + (Number(produto.estoque) || 0) + ' unidade(s).', 'err');
      produto.estoque = (Number(produto.estoque) || 0) - qty;

      const etiquetasBaixadas = baixarEtiquetasDoProduto(produtoId, qty, escolhidas);
      const custoUnitarioSnapshot = window.custoInsumosPorUnidade ? window.custoInsumosPorUnidade(produtoId) : null;
      const vendaNova = {
        id: uid(),
        data: dataHoraEl && dataHoraEl.value ? datetimeLocalToISO(dataHoraEl.value) : nowISO(),
        itens: [{ produtoId, qty, preco: Number(produto.preco), custoUnitarioInsumos: custoUnitarioSnapshot }],
        origem: 'manual',
        etiquetasBaixadas,
        baixaPendente: window.currentUserRole === 'vendedor',
        localCanal: document.getElementById('vendaCanal')?.value?.trim() || 'Venda de campo',
        vendedorUid: destUser ? destUser.uid : (window.currentFirebaseUser?.uid || ''),
        vendedorEmail: destUser ? (destUser.email || '') : (window.currentFirebaseUser?.email || ''),
        comissaoPorcentagem: destUser ? Number(window.taxaComissaoUsuario(destUser)) : comissaoAplicavel(),
        statusAcerto: 'pendente'
      };
      DB.vendas.push(vendaNova);
      if (window.salvarVendaFirestore) window.salvarVendaFirestore(vendaNova);

      persist('produtos', 'vendas', 'producoes');
      fecharModalDirect();
      render();
      toast('Venda registrada com sucesso!', 'ok');
    }

    function deletarVenda(id) {
      const venda = DB.vendas.find(v => v.id === id);
      if (!venda) return;
      if (!confirm('Deseja excluir esta venda? O estoque do(s) produto(s) será devolvido.')) return;

      (Array.isArray(venda.itens) ? venda.itens : []).forEach(it => {
        const p = findProduto(it.produtoId);
        if (p) p.estoque = p.estoque + it.qty;
      });

      if (Array.isArray(venda.etiquetasBaixadas)) devolverEtiquetas(venda.etiquetasBaixadas);

      if (venda.origem === 'bipagem' && venda.codigo) {
        const achado = findItemByCode(venda.codigo);
        if (achado && achado.item) achado.item.status = 'disponivel';
      }

      DB.vendas = DB.vendas.filter(v => v.id !== id);
      persist('produtos', 'vendas', 'producoes');
      render();
      toast('Venda excluída e estoque devolvido!', 'ok');
    }

    function extratoCaixa() {
      const lista = [];
      DB.vendas.forEach(v => {
        // Venda de vendedor ainda sem acerto: o dinheiro não chegou à loja, então não entra no caixa
        if (window.vendaAguardandoAcerto && window.vendaAguardandoAcerto(v)) return;
        lista.push({
          id: 'venda-' + v.id,
          data: window.vendaDataCaixa ? window.vendaDataCaixa(v) : vendaDia(v),
          tipo: 'entrada',
          categoria: 'Vendas',
          descricao: (Array.isArray(v.itens) ? v.itens : []).map(it => { const p = findProduto(it.produtoId); return it.qty + 'x ' + (p ? p.nome : '—'); }).join(', '),
          valor: vendasFaturamento(v),
          origem: 'venda'
        });
      });
      DB.caixa.forEach(c => lista.push({ ...c, origem: 'manual' }));
      (window.lancamentosComissaoCaixa ? window.lancamentosComissaoCaixa() : []).forEach(c => lista.push(c));

      lista.sort((a, b) => a.data < b.data ? -1 : (a.data > b.data ? 1 : 0));

      let acc = Number(DB.config && DB.config.saldoInicialCaixa) || 0;
      lista.forEach(l => { acc += (l.tipo === 'entrada' ? Number(l.valor || 0) : -Number(l.valor || 0)); l.saldoAcumulado = acc; });
      return lista;
    }

    function viewCaixa() {
      const extrato = extratoCaixa();
      const saldoTotal = extrato.length ? extrato[extrato.length - 1].saldoAcumulado : (Number(DB.config && DB.config.saldoInicialCaixa) || 0);

      const minCx = extrato.reduce((m, l) => (l.data && (!m || l.data < m)) ? l.data : m, '');
      const days = periodDaysFiltro(PERIODO.caixa, minCx);
      const lblPer = periodoLabel(PERIODO.caixa, days);
      const startPeriodo = days[0];
      const endPeriodo = days[days.length - 1];
      const saldoInicial = (Number(DB.config && DB.config.saldoInicialCaixa) || 0) + extrato.filter(l => l.data < startPeriodo).reduce((s, l) => s + (l.tipo === 'entrada' ? l.valor : -l.valor), 0);

      const dayLabels = days.map(d => fmtDate(d).slice(0, 5));
      const dayEntradas = days.map(d => extrato.filter(l => l.data === d && l.tipo === 'entrada').reduce((s, l) => s + l.valor, 0));
      const daySaidas = days.map(d => extrato.filter(l => l.data === d && l.tipo === 'saida').reduce((s, l) => s + l.valor, 0));
      const daySaldoAcumulado = [];
      let acc = saldoInicial;
      days.forEach((d, i) => { acc += dayEntradas[i] - daySaidas[i]; daySaldoAcumulado.push(acc); });

      const entradasPeriodo = dayEntradas.reduce((a, b) => a + b, 0);
      const saidasPeriodo = daySaidas.reduce((a, b) => a + b, 0);
      const saldoPeriodo = entradasPeriodo - saidasPeriodo;
      const temMovimentoPeriodo = dayEntradas.some(v => v > 0) || daySaidas.some(v => v > 0);

      window.__caixa = { dayLabels, dayEntradas, daySaidas, daySaldoAcumulado };

      const linhasExtrato = extrato.filter(l => l.data >= startPeriodo && l.data <= endPeriodo).slice().reverse();
      const rows = linhasExtrato.map(l => `
        <tr>
          <td><span class="mono">${fmtDate(l.data)}</span></td>
          <td>${l.tipo === 'entrada' ? '<span class="badge badge-ok">Entrada</span>' : '<span class="badge badge-danger">Saída</span>'}</td>
          <td>${esc(l.categoria)}</td>
          <td>${esc(l.descricao || '—')}</td>
          <td style="text-align:right;"><b>${l.tipo === 'entrada' ? '+ ' : '- '}${fmtMoney(l.valor)}</b></td>
          <td style="text-align:right;" class="mono">${fmtMoney(l.saldoAcumulado)}</td>
          <td style="text-align:right;">
            ${l.origem === 'manual'
              ? `<button class="icon-btn" onclick="modalCaixa('${l.id}')">✏️ Edit</button><button class="icon-btn" onclick="deletarCaixa('${l.id}')">🗑️</button>`
              : (l.origem === 'comissao' ? '<span class="badge badge-muted">Acerto</span>' : '<span class="badge badge-muted">Venda</span>')}
          </td>
        </tr>
      `).join('');

      const aguardando = DB.vendas.filter(v => window.vendaAguardandoAcerto && window.vendaAguardandoAcerto(v));
      const aReceber = aguardando.reduce((t, v) => t + vendasFaturamento(v) - (window.saleCommission ? window.saleCommission(v) : 0), 0);
      const avisoReceber = aguardando.length
        ? `<div class="help-note"><b>A receber de vendedores:</b> ${fmtMoney(aReceber)} em ${aguardando.length} venda(s) aguardando acerto. Esse valor entra no caixa quando a venda for quitada em Comissões / Acertos.</div>`
        : '';

      return `
      ${avisoReceber}
      <div class="grid grid-4">
        <div class="card stat"><div class="label">Saldo atual</div><div class="value">${fmtMoney(saldoTotal)}</div><div class="delta">acumulado de todo o histórico</div></div>
        <div class="card stat"><div class="label">Entradas (período)</div><div class="value">${fmtMoney(entradasPeriodo)}</div><div class="delta">${lblPer}</div></div>
        <div class="card stat"><div class="label">Saídas (período)</div><div class="value">${fmtMoney(saidasPeriodo)}</div><div class="delta">${lblPer}</div></div>
        <div class="card stat"><div class="label">Saldo do período</div><div class="value">${fmtMoney(saldoPeriodo)}</div><div class="delta ${saldoPeriodo < 0 ? 'down' : ''}">${saldoPeriodo >= 0 ? 'positivo' : 'negativo'}</div></div>
      </div>

      ${window.cardLucroCapital ? window.cardLucroCapital() : ''}

      <div class="card card-pad" style="margin-top:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;">
          <h3 style="font-size:15px;margin:0;">Saldo acumulado — ${lblPer}</h3>
          ${filtroPeriodoHtml('caixa')}
        </div>
        <div class="chart-wrap"><canvas id="chartCaixaSaldo"></canvas></div>
      </div>

      <div class="card card-pad" style="margin-top:16px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Entradas x Saídas — ${lblPer}</h3>
        <div class="chart-wrap">${temMovimentoPeriodo ? '<canvas id="chartCaixaFluxo"></canvas>' : emptyBlock('Sem movimentações no período', 'Registre vendas ou lançamentos para ver o gráfico.')}</div>
      </div>

      <div class="card card-pad" style="margin-top:16px;">
        <h3 style="font-size:15px;margin-bottom:12px;">Extrato (${lblPer})</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th>
                <th style="text-align:right;">Valor</th><th style="text-align:right;">Saldo</th>
                <th style="text-align:right;">Ações</th>
              </tr>
            </thead>
            <tbody>
              ${rows.length ? rows : '<tr><td colspan="7" class="empty">Nenhuma movimentação no período.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
      `;
    }

    function renderCaixaCharts() {
      const dash = window.__caixa;
      if (!dash) return;

      const saldoCanvas = document.getElementById('chartCaixaSaldo');
      if (saldoCanvas) {
        destroyDashChart('caixaSaldo');
        dashChartInstances.caixaSaldo = new Chart(saldoCanvas, {
          type: 'line',
          data: { labels: dash.dayLabels, datasets: [{ data: dash.daySaldoAcumulado, borderColor: '#8B5A3C', backgroundColor: 'rgba(139, 90, 60, .08)', fill: true, tension: .35, pointRadius: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => 'R$ ' + v } } } }
        });
      }

      const fluxoCanvas = document.getElementById('chartCaixaFluxo');
      if (fluxoCanvas) {
        destroyDashChart('caixaFluxo');
        dashChartInstances.caixaFluxo = new Chart(fluxoCanvas, {
          type: 'bar',
          data: {
            labels: dash.dayLabels,
            datasets: [
              { label: 'Entradas', data: dash.dayEntradas, backgroundColor: '#5E8C6D', borderRadius: 4 },
              { label: 'Saídas', data: dash.daySaidas.map(v => -v), backgroundColor: '#B25E4A', borderRadius: 4 }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
            scales: { y: { ticks: { callback: v => 'R$ ' + v } } }
          }
        });
      }
    }

    function salvarCaixa(id) {
      const tipo = document.getElementById('caixaTipo').value;
      const data = document.getElementById('caixaData').value || todayISO();
      const categoria = document.getElementById('caixaCategoria').value.trim() || (tipo === 'entrada' ? 'Outras receitas' : 'Outros');
      const descricao = document.getElementById('caixaDescricao').value.trim();
      const valorRaw = document.getElementById('caixaValor').value;
      const valor = valorRaw === '' ? NaN : Number(valorRaw);
      if (!Number.isFinite(valor) || valor <= 0) return toast('Informe um valor maior que zero', 'err');
      if (tipo === 'entrada' && /venda|faturamento|palha italiana/i.test(categoria)) return toast('As vendas já são lançadas automaticamente no fluxo de caixa. Use uma categoria como “Outras receitas” apenas para entradas diferentes de vendas.', 'err');

      const lanc = { id: id || uid(), tipo, data, categoria, descricao, valor };
      if (id) {
        const idx = DB.caixa.findIndex(c => c.id === id);
        if (idx !== -1) DB.caixa[idx] = lanc;
      } else {
        DB.caixa.push(lanc);
      }
      persist('caixa');
      fecharModalDirect();
      render();
      toast('Lançamento salvo!', 'ok');
    }

    function deletarCaixa(id) {
      if (!confirm('Deseja excluir este lançamento?')) return;
      DB.caixa = DB.caixa.filter(c => c.id !== id);
      persist('caixa');
      render();
      toast('Lançamento removido!', 'ok');
    }

    // ---------- Seletor: receita em estoque -> etiqueta disponível ----------
    function bipItemDisponivel(it) { return !it.status || it.status === 'disponivel'; }

    function bipProdutosDisponiveis() {
      const mapa = {};
      (DB.producoes || []).forEach(pr => {
        const n = (pr.itens || []).filter(bipItemDisponivel).length;
        if (n > 0) mapa[pr.produtoId] = (mapa[pr.produtoId] || 0) + n;
      });
      return Object.keys(mapa)
        .map(id => ({ produto: findProduto(id), qtd: mapa[id] }))
        .filter(x => x.produto)
        .sort((a, b) => String(a.produto.nome).localeCompare(String(b.produto.nome), 'pt-BR'));
    }

    // Botão único: 1º toque escolhe a receita em estoque, 2º toque escolhe a etiqueta
    function abrirSeletorBip(produtoId) {
      const btnLinha = 'margin-bottom:8px;';
      let titulo, corpo;
      if (!produtoId) {
        const lista = bipProdutosDisponiveis();
        titulo = '1. Escolha a receita';
        corpo = lista.length
          ? lista.map(x => `<button type="button" class="bip-box" style="${btnLinha}" onclick="abrirSeletorBip('${esc(x.produto.id)}')"><span>${esc(x.produto.nome)}</span><span class="badge badge-muted">${x.qtd} em estoque</span></button>`).join('')
          : '<p class="empty">Nenhuma receita com etiqueta disponível.</p>';
      } else {
        const prod = findProduto(produtoId);
        const etiquetas = bipEtiquetasOrdenadas(produtoId);
        titulo = '2. Escolha a etiqueta';
        corpo = `<p style="margin:0 0 10px;"><button class="btn btn-secondary btn-sm" onclick="abrirSeletorBip()">← Receitas</button> <b>${esc(prod ? prod.nome : '')}</b></p>` +
          (etiquetas.length
            ? etiquetas.map(e => `<button type="button" class="bip-box" style="${btnLinha}" onclick="escolherEtiquetaBip('${esc(e.it.codigo)}')"><span class="mono">${esc(e.it.codigo)}</span><span class="hint">Lote ${esc(e.pr.lote || '—')} · val. ${fmtDate(e.pr.dataValidade)}</span></button>`).join('')
            : '<p class="empty">Sem etiquetas disponíveis.</p>');
      }
      document.getElementById('modalRoot').innerHTML = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal" style="max-width:440px;">
            <div class="modal-head"><h3>${titulo}</h3><button class="modal-close" onclick="fecharModalDirect()">×</button></div>
            <div class="modal-body" style="max-height:60vh;overflow:auto;">${corpo}</div>
          </div>
        </div>`;
    }

    // Tipo de operação: botão que abre a janela com as opções
    function abrirSeletorTipoBip() {
      const tipos = Object.keys(TIPO_BIP_LABELS);
      const itens = tipos.map(k =>
        `<button type="button" class="bip-box" style="margin-bottom:8px;" onclick="escolherTipoBip('${k}')"><span>${esc(TIPO_BIP_LABELS[k])}</span>${k === BIPAGEM_TIPO ? '<span class="badge badge-muted">Selecionado</span>' : ''}</button>`
      ).join('');

        <div class="modal-backdrop" onclick="fecharModal(event)">

            <div class="modal-body">${itens}</div>

    function escolherTipoBip(tipo) {
      BIPAGEM_TIPO = tipo;
      const el = document.getElementById('bipTipoTexto');
      if (el) el.textContent = TIPO_BIP_LABELS[tipo] || tipo;
      fecharModalDirect();
