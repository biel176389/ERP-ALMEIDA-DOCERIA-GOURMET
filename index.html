<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import { 
  getAuth, 
  signInWithEmailAndPassword, 
  createUserWithEmailAndPassword, 
  signInWithPopup, 
  GoogleAuthProvider, 
  signOut, 
  onAuthStateChanged 
} from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDock, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import { getDatabase } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyCItji6rUERsaVtv2mbTXkAoY3GYxzOqOs",
  authDomain: "erp-doceria-almeida.firebaseapp.com",
  projectId: "erp-doceria-almeida",
  storageBucket: "erp-doceria-almeida.firebasestorage.app",
  messagingSenderId: "681128555274",
  appId: "1:681128555274:web:de374ea428bc135c4480f3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const rtdb = getDatabase(app);

window.firebaseAuth = auth;

// Funções globais de Autenticação
window.fazerLogin = async (email, senha) => {
  return await signInWithEmailAndPassword(auth, email, senha);
};

window.fazerCadastro = async (email, senha) => {
  return await createUserWithEmailAndPassword(auth, email, senha);
};

window.fazerLoginGoogle = async () => {
  const provider = new GoogleAuthProvider();
  return await signInWithPopup(auth, provider);
};

window.fazerLogout = async () => {
  return await signOut(auth);
};

// Monitorar Estado de Autenticação
onAuthStateChanged(auth, async (user) => {
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('app');

  if (user) {
    if (loginScreen) loginScreen.style.display = 'none';
    if (appScreen) appScreen.style.display = 'flex';
    const userEmailEl = document.getElementById('currentUserEmail');
    if (userEmailEl) userEmailEl.textContent = user.email || 'Usuário Autenticado';
    
    if (window.loadAll) {
      await window.loadAll();
    }
    if (window.render) window.render();
  } else {
    if (appScreen) appScreen.style.display = 'none';
    if (loginScreen) loginScreen.style.display = 'flex';
  }
});

window.salvarDadosNoFirebase = async function (dados) {
  const colecao = 'erp_data';
  const chaves = ['config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog', 'etiquetaLayout'];
  await Promise.all(chaves.map(async (chave) => {
    await setDoc(doc(db, colecao, chave), {
      dados: dados[chave] ?? null,
      atualizadoEm: serverTimestamp()
    }, { merge: true });
  }));
};

window.firebasePronto = true;
console.log("Firebase e Autenticação inicializados com sucesso!");
</script>

  <script>
    /* ---------------- Auth UI Control ---------------- */
    let modoAuth = 'entrar';

    function alternarVisibilidadeSenha() {
      const input = document.getElementById('authSenha');
      const icon = document.getElementById('iconOlho');
      if (!input) return;
      const ficaraVisivel = input.type === 'password';
      input.type = ficaraVisivel ? 'text' : 'password';
      if (icon) {
        icon.innerHTML = ficaraVisivel
          ? '<path d="M3 3l18 18M10.6 10.6a3 3 0 0 0 4.24 4.24M9.9 4.24A11 11 0 0 1 12 4c7 0 11 7 11 7a13.3 13.3 0 0 1-3.1 3.8M6.1 6.1A13.4 13.4 0 0 0 1 11s4 7 11 7c1.5 0 2.87-.3 4.1-.8"/>'
          : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>';
      }
    }

    function alternarAbaLogin(modo) {
      modoAuth = modo;
      document.getElementById('tabEntrar').classList.toggle('active', modo === 'entrar');
      document.getElementById('tabCadastrar').classList.toggle('active', modo === 'cadastrar');
      document.getElementById('btnAuthSubmit').textContent = modo === 'entrar' ? 'Entrar' : 'Cadastrar';
    }

    async function submeterAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const senha = document.getElementById('authSenha').value;

      try {
        if (modoAuth === 'entrar') {
          await window.fazerLogin(email, senha);
          toast('Login realizado com sucesso!', 'ok');
        } else {
          await window.fazerCadastro(email, senha);
          toast('Conta criada com sucesso!', 'ok');
        }
      } catch (err) {
        if (modoAuth === 'entrar' && (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found')) {
          toast('Conta não cadastrada. Mudei para a aba "Criar Conta"!', 'err');
          alternarAbaLogin('cadastrar');
        } else {
          toast('Erro de autenticação: ' + err.message, 'err');
        }
      }
    }

    async function submeterGoogle() {
      try {
        await window.fazerLoginGoogle();
        toast('Login Google realizado!', 'ok');
      } catch (err) {
        toast('Erro no login Google: ' + err.message, 'err');
      }
    }

    /* ---------------- helpers ---------------- */
    const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const nowISO = () => new Date().toISOString();
    const fmtMoney = (v) => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fmtDate = (iso) => { if (!iso) return '—'; const d = new Date(iso + 'T00:00:00'); return d.toLocaleDateString('pt-BR'); };
    const fmtDateTime = (iso) => { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
    const addDays = (iso, days) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + Number(days || 0)); return d.toISOString().slice(0, 10); };
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c]));
    const slug = (s) => (s || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]+/g, '').slice(0, 6) || 'PRD';

    function toast(msg, type) {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = 'toast ' + (type || '');
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { 
        el.style.transition = 'opacity .25s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250); 
      }, 3200);
    }

    /* ---------------- storage (Compatível com iPhone e iOS Safari) ---------------- */
    const STORE_KEYS = ['config', 'insumos', 'produtos', 'producoes', 'vendas', 'scanlog', 'etiquetaLayout'];
    let DB = {
      config: {},
      insumos: [],
      produtos: [],
      producoes: [],
      vendas: [],
      scanlog: [],
      etiquetaLayout: {}
    };

    function defaultEtiquetaLayout() {
      return {
        larguraCm: 9,

        alturaAuto: true,
        orientacao: 'retrato',

        textoCuidadosTitulo: '⚠ Cuidados & Conservação',
        textoContatoTitulo: 'Atendimento / Vendas',
      };
    }

    function defaultConfig() {
      return {
        nome: 'Almeida Doce Gourmet',
        whatsapp: '(32) 98448-1635',
        instagram: 'almeidadocergourmet',
        origem: 'Miraí - MG',
        cuidados: 'Manter em local fresco, seco e ao abrigo da luz solar.\nApós aberto, consumir em até 3 dias.\nEvitar armazenar próximo a produtos com cheiro forte.',
        deducaoInsumos: 'producao'
      };
    }

    function seedData() {
      const leite = { id: uid(), nome: 'Leite Condensado', unidade: 'un', estoque: 24, estoqueMin: 6, custo: 5.20 };
      const choc = { id: uid(), nome: 'Chocolate em Pó', unidade: 'kg', estoque: 3.5, estoqueMin: 1, custo: 24.00 };
      const bolacha = { id: uid(), nome: 'Bolacha Maisena', unidade: 'kg', estoque: 5, estoqueMin: 2, custo: 9.80 };
      const insumos = [leite, choc, bolacha];
      const produtos = [{
        id: uid(),
        nome: 'Palha Italiana Tradicional',
        sku: 'PLH-TRAD',
        categoria: 'Doces',
        preco: 6.00,
        validadeDias: 15,
        estoque: 0,
        estoqueMin: 10,
        pesoMedio: 0.15,
        receita: [
          { insumoId: leite.id, qtd: 0.08 },
          { insumoId: choc.id, qtd: 0.03 },
          { insumoId: bolacha.id, qtd: 0.05 },
        ]
      }];
      return { insumos, produtos };
    }

   async function loadKey(key, fallback) {
  try {
    const snap = await getDoc(doc(db, 'erp_data', key));
    if (snap.exists() && snap.data().dados != null) {
      const dados = snap.data().dados;
      localStorage.setItem('docemg_' + key, JSON.stringify(dados));
      return dados;
    }
    const local = localStorage.getItem('docemg_' + key);
    if (local != null) return JSON.parse(local);
    return fallback;
  } catch (e) {
    console.error(e);
    const local = localStorage.getItem('docemg_' + key);
    if (local != null) return JSON.parse(local);
    return fallback;
  }
}
async function saveKey(key, value) {
  try {
    localStorage.setItem('docemg_' + key, JSON.stringify(value));
    await setDoc(doc(db, 'erp_data', key), {
      dados: value,
      atualizadoEm: serverTimestamp()
    }, { merge: true });
  } catch (e) {
    toast('Erro ao salvar dados', 'err');
    console.error(e);
  }
}
    window.loadAll = async function() {
      const seeded = seedData();
      DB.config = await loadKey('config', defaultConfig());
      DB.insumos = await loadKey('insumos', seeded.insumos);
      DB.produtos = await loadKey('produtos', seeded.produtos);
      DB.producoes = await loadKey('producoes', []);
      DB.vendas = await loadKey('vendas', []);
      DB.scanlog = await loadKey('scanlog', []);
      DB.etiquetaLayout = await loadKey('etiquetaLayout', defaultEtiquetaLayout());
      if (window.aplicarLayoutEtiquetaCSS) window.aplicarLayoutEtiquetaCSS();
    };

    function persist(...keys) { 
      keys.forEach(k => saveKey(k, DB[k])); 
      if (window.salvarDadosNoFirebase) {
        window.salvarDadosNoFirebase(DB);
      }
    }

    /* ---------------- lookups ---------------- */
    const findInsumo = (id) => DB.insumos.find(i => i.id === id);
    const findProduto = (id) => DB.produtos.find(p => p.id === id);

    function produtoLowStock(p) { return p.estoque <= p.estoqueMin; }
    function insumoLowStock(i) { return i.estoque <= i.estoqueMin; }

    function findItemByCode(code) {
      code = (code || '').trim().toUpperCase();
      if (!code) return null;
      for (const prod of DB.producoes) {
        const it = prod.itens.find(x => x.codigo.toUpperCase() === code);
        if (it) return { producao: prod, item: it };
      }
      return null;
    }

    function deduzInsumos(produto, qty) {
      const out = [];
      (produto.receita || []).forEach(r => {
        const ins = findInsumo(r.insumoId);
        if (!ins) return;
        const amount = r.qtd * qty;
        ins.estoque = Math.round((ins.estoque - amount) * 10000) / 10000;
        out.push({ insumo: ins, deducted: amount });
      });
      return out;
    }

    /* ---------------- app / router state ---------------- */
    let ROUTE = 'dashboard';
    let SALE_CART = [];

    function iconTag() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 3 11v0a2 2 0 0 0 0 2.8l7.2 7.2a2 2 0 0 0 2.8 0L21 13V4a2 2 0 0 0-2-2h-7Z"/><circle cx="16" cy="8" r="1.4"/></svg>'; }
    function iconBox() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3.5 7 8.5-4 8.5 4-8.5 4-8.5-4Z"/><path d="M3.5 7v10l8.5 4 8.5-4V7"/><path d="M12 11v10"/></svg>'; }

    function iconScan() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 1 2 2h3M21 16v3a2 2 0 0 1-2 2h-3M3 12h18"/></svg>'; }

      mnav.innerHTML = NAV_ITEMS.map(it => `<button class="${ROUTE===it.id?'active':''}" data-route="${it.id}">${it.icon()}<span>${it.label}</span></button>`).join('');

      produtos: ['Produtos', 'Cadastro de itens e fichas técnicas'],

      vendas: ['Vendas', 'Registre vendas por bipagem ou manualmente'],
      bipagem: ['Bipagem', 'Saída rápida de itens por QR Code'],
      etiquetas: ['Etiquetas', 'Gere e reimprima etiquetas com QR Code'],
      relatorios: ['Relatórios', 'Faturamento, consumo e desempenho'],

    };

    function periodDays(n) {
      const out = [];
      for (let i = n - 1; i >= 0; i--) { out.push(addDays(todayISO(), -i)); }
      return out;
    }

    function vendasFaturamento(v) { return v.itens.reduce((s, i) => s + i.preco * i.qty, 0); }

    function vendaCusto(v) {
      return v.itens.reduce((s, it) => {
        const p = findProduto(it.produtoId);
        if (!p) return s;
        const custoUnit = (p.receita || []).reduce((acc, r) => { 
          const ins = findInsumo(r.insumoId); 
          return acc + (ins ? ins.custo * r.qtd : 0); 
        }, 0);
        return s + custoUnit * it.qty;
      }, 0);
    }

    function viewDashboard() {
      const hoje = todayISO();
      const mesRef = hoje.slice(0, 7);
      const vendasMes = DB.vendas.filter(v => v.data.slice(0, 7) === mesRef);
      const faturamentoMes = vendasMes.reduce((s, v) => s + vendasFaturamento(v), 0);
      const custoMes = vendasMes.reduce((s, v) => s + vendaCusto(v), 0);
      const lucroMes = faturamentoMes - custoMes;
      const vendasHoje = DB.vendas.filter(v => v.data === hoje);
      const itensHoje = vendasHoje.reduce((s, v) => s + v.itens.reduce((a, i) => a + i.qty, 0), 0);
      const lowInsumos = DB.insumos.filter(insumoLowStock).length;
      const lowProdutos = DB.produtos.filter(produtoLowStock).length;

      const days = periodDays(14);
      const dayLabels = days.map(d => fmtDate(d).slice(0, 5));
      const dayTotals = days.map(d => DB.vendas.filter(v => v.data === d).reduce((s, v) => s + vendasFaturamento(v), 0));

      const porProduto = {};
      DB.vendas.forEach(v => v.itens.forEach(it => { porProduto[it.produtoId] = (porProduto[it.produtoId] || 0) + it.qty; }));
      const topProdutos = Object.entries(porProduto).sort((a, b) => b[1] - a[1]).slice(0, 5)
        .map(([id, qty]) => ({ nome: (findProduto(id) || {}).nome || '—', qty }));

      window.__dash = { dayLabels, dayTotals, topProdutos };

      return `
      <div class="grid grid-4">
        <div class="card stat"><div class="label">Faturamento (mês)</div><div class="value">${fmtMoney(faturamentoMes)}</div><div class="delta">${vendasMes.length} venda(s) no mês</div></div>
        <div class="card stat"><div class="label">Lucro estimado (mês)</div><div class="value">${fmtMoney(lucroMes)}</div><div class="delta">custo insumos: ${fmtMoney(custoMes)}</div></div>
        <div class="card stat"><div class="label">Itens vendidos hoje</div><div class="value">${itensHoje}</div><div class="delta">${vendasHoje.length} venda(s) hoje</div></div>
        <div class="card stat"><div class="label">Alertas de estoque</div><div class="value">${lowInsumos+lowProdutos}</div><div class="delta ${(lowInsumos+lowProdutos)?'down':''}">${lowProdutos} produto(s) · ${lowInsumos} insumo(s)</div></div>
      </div>

      <div class="grid grid-2" style="margin-top:16px;">
        <div class="card card-pad">
          <h3 style="font-size:15px;margin-bottom:12px;">Faturamento — últimos 14 dias</h3>
          <div class="chart-wrap"><canvas id="chartFat"></canvas></div>
        </div>
        <div class="card card-pad">
          <h3 style="font-size:15px;margin-bottom:12px;">Produtos mais vendidos</h3>
          <div class="chart-wrap">${topProdutos.length? '<canvas id="chartTop"></canvas>' : emptyBlock('Sem vendas ainda','Registre vendas para ver o ranking aqui.')}</div>
        </div>
      </div>
      `;
    }

    function emptyBlock(title, text) {
      return `<div class="empty" style="height:100%;display:flex;flex-direction:column;justify-content:center;"><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`;
    }

    let chartFatInstance = null, chartTopInstance = null;

    function renderDashCharts() {
      const dash = window.__dash;
      if (!dash) return;
      const fatCanvas = document.getElementById('chartFat');
      if (fatCanvas) {
        if (chartFatInstance) chartFatInstance.destroy();
        chartFatInstance = new Chart(fatCanvas, {
          type: 'line',
          data: { labels: dash.dayLabels, datasets: [{ data: dash.dayTotals, borderColor: '#8B5A3C', backgroundColor: 'rgba(139, 90, 60, .08)', fill: true, tension: .35, pointRadius: 2 }] },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { ticks: { callback: v => 'R$ ' + v } } } }
        });
      }
      const topCanvas = document.getElementById('chartTop');
      if (topCanvas) {
        if (chartTopInstance) chartTopInstance.destroy();
        chartTopInstance = new Chart(topCanvas, {
          type: 'bar',
          data: { labels: dash.topProdutos.map(p => p.nome), datasets: [{ data: dash.topProdutos.map(p => p.qty), backgroundColor: '#C29A6B', borderRadius: 6 }] },
          options: { responsive: true, maintainAspectRatio: false, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { ticks: { stepSize: 1 } } } }
        });
      }
    }

    function salvarInsumo(id) {
      const nome = document.getElementById('insNome').value.trim();
      if (!nome) return toast('Informe o nome do insumo', 'err');
      const ins = {
        id: id || uid(),
        nome,
        unidade: document.getElementById('insUnidade').value,
        custo: parseFloat(document.getElementById('insCusto').value) || 0,
        estoque: parseFloat(document.getElementById('insEstoque').value) || 0,
        estoqueMin: parseFloat(document.getElementById('insEstoqueMin').value) || 0
      };
      if (id) {
        const idx = DB.insumos.findIndex(i => i.id === id);
        if (idx !== -1) DB.insumos[idx] = ins;
      } else {
        DB.insumos.push(ins);
      }
      persist('insumos');
      fecharModalDirect();
      render();
      toast('Insumo salvo!', 'ok');
    }

    function deletarInsumo(id) {
      if (!confirm('Deseja excluir este insumo?')) return;
      DB.insumos = DB.insumos.filter(i => i.id !== id);
      persist('insumos');
      render();
      toast('Insumo removido!', 'ok');
    }

        dataValidade: ''
      };
      const dataFabInicial = prod.dataFabricacao || todayISO();
      const dataValInicial = prod.dataValidade || addDays(dataFabInicial, DIAS_VALIDADE_PADRAO);

      const content = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal">
            <div class="modal-head">
              <h3>${id ? 'Editar Produção' : 'Registrar Produção'}</h3>
              <button class="modal-close" onclick="fecharModalDirect()">×</button>
            </div>
            <div class="modal-body">
              <div class="field">
                <label>Produto</label>
                <select id="prodProdutoId" class="input">
                  ${DB.produtos.map(p => `<option value="${p.id}" ${p.id === prod.produtoId ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Quantidade Produzida</label>
                <input type="number" id="prodQtd" class="input" value="${prod.quantidade}">
              </div>
              <div class="field-row">
                <div class="field">
                  <label>Data Fabricação</label>
                  <input type="date" id="prodDataFab" class="input" value="${dataFabInicial}" oninput="atualizarValidadeProducao()">
                </div>
                <div class="field">
                  <label>Data Validade</label>
                  <input type="date" id="prodDataVal" class="input" value="${dataValInicial}">
                </div>
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="salvarProducao('${id || ''}')">Confirmar Produção</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalRoot').innerHTML = content;
    }

    function salvarProducao(id = '') {
      const produtoId = document.getElementById('prodProdutoId').value;
      const qtd = parseInt(document.getElementById('prodQtd').value) || 0;
      const dataFab = document.getElementById('prodDataFab').value || todayISO();
      const produto = findProduto(produtoId);
      if (!produto || qtd <= 0) return toast('Insira uma quantidade válida', 'err');

      const dataVal = document.getElementById('prodDataVal').value || addDays(dataFab, produto.validadeDias);

      if (id) {
        const prod = DB.producoes.find(p => p.id === id);
        if (prod) {
          const diff = qtd - prod.quantidade;
          prod.quantidade = qtd;
          prod.produtoId = produtoId;
          prod.dataFabricacao = dataFab;
          prod.dataValidade = dataVal;
          produto.estoque = Math.max(0, produto.estoque + diff);
        }
      } else {
        const lote = 'L' + Date.now().toString().slice(-6);
        const itens = [];
        for (let i = 1; i <= qtd; i++) {
          itens.push({
            codigo: `${produto.sku}-${lote}-${i}`,
            status: 'disponivel'
          });
        }

        if (DB.config.deducaoInsumos === 'producao') {
          deduzInsumos(produto, qtd);
        }

        produto.estoque += qtd;

        DB.producoes.push({
          id: uid(),
          lote,
          produtoId,
          quantidade: qtd,
          dataFabricacao: dataFab,
          dataValidade: dataVal,
          itens
        });
      }

      persist('produtos', 'producoes', 'insumos');
      fecharModalDirect();
      render();
      toast(id ? 'Produção atualizada com sucesso!' : 'Lote produzido com sucesso!', 'ok');
    }

    function deletarProducao(id) {
      if (!confirm('Deseja excluir este registro de produção?')) return;
      const prod = DB.producoes.find(p => p.id === id);
      if (prod) {
        const produto = findProduto(prod.produtoId);
        if (produto) {
          produto.estoque = Math.max(0, produto.estoque - prod.quantidade);
        }
      }
      DB.producoes = DB.producoes.filter(p => p.id !== id);
      persist('produtos', 'producoes');
      render();
      toast('Registro de produção removido!', 'ok');
    }

    // Módulo Vendas
    function viewVendas() {
      const rows = DB.vendas.map(v => `
        <tr>
          <td><span class="mono">${fmtDateTime(v.data)}</span></td>
          <td>${v.itens.map(i => `${i.qty}x ${(findProduto(i.produtoId)||{}).nome||'—'}`).join(', ')}</td>
          <td><b>${fmtMoney(vendasFaturamento(v))}</b></td>
        </tr>
      `).join('');

      return `
        <div class="card card-pad">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Itens</th>
                  <th>Total Venda</th>
                </tr>
              </thead>
              <tbody>
                ${rows.length ? rows : '<tr><td colspan="3" class="empty">Nenhuma venda realizada.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function modalVenda() {
      const content = `
        <div class="modal-backdrop" onclick="fecharModal(event)">
          <div class="modal">
            <div class="modal-head">
              <h3>Nova Venda Manual</h3>
              <button class="modal-close" onclick="fecharModalDirect()">×</button>
            </div>
            <div class="modal-body">
              <div class="field">
                <label>Produto</label>
                <select id="vendaProdutoId" class="input">
                  ${DB.produtos.map(p => `<option value="${p.id}">${esc(p.nome)} - ${fmtMoney(p.preco)}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label>Quantidade</label>
                <input type="number" id="vendaQtd" class="input" value="1">
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn btn-secondary" onclick="fecharModalDirect()">Cancelar</button>
              <button class="btn btn-primary" onclick="salvarVenda()">Finalizar Venda</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('modalRoot').innerHTML = content;
    }

    function salvarVenda() {
      const produtoId = document.getElementById('vendaProdutoId').value;
      const qty = parseInt(document.getElementById('vendaQtd').value) || 0;
      const produto = findProduto(produtoId);
      if (!produto || qty <= 0) return toast('Quantidade inválida', 'err');

      produto.estoque = Math.max(0, produto.estoque - qty);

      DB.vendas.push({
        id: uid(),
        data: nowISO(),
        itens: [{ produtoId, qty, preco: produto.preco }]
      });

      persist('produtos', 'vendas');
      fecharModalDirect();
      render();
      toast('Venda registrada com sucesso!', 'ok');
    }

    // Módulo Bipagem
    const TIPO_BIP_LABELS = {
      venda: 'Venda Avulsa',
      doacao: 'Doação',
      perda: 'Perda / Avaria'
    };

    function viewBipagem() {
      return `
        <div class="card card-pad scan-box">
          <h2>Saída Rápida por Bipagem</h2>
          <p class="hint">Escaneie o QR Code da etiqueta com a câmera ou digite/leia o código com um leitor físico.</p>

          <div class="field" style="max-width:320px;margin:18px auto 0;text-align:left;">
            <label>Tipo de Operação</label>
            <select id="bipTipo" class="input" onchange="BIPAGEM_TIPO = this.value">
              <option value="venda" ${BIPAGEM_TIPO === 'venda' ? 'selected' : ''}>Venda Avulsa</option>
              <option value="doacao" ${BIPAGEM_TIPO === 'doacao' ? 'selected' : ''}>Doação</option>
              <option value="perda" ${BIPAGEM_TIPO === 'perda' ? 'selected' : ''}>Perda / Avaria</option>
            </select>
          </div>

          <div style="max-width:320px;margin:16px auto;">
            <input type="text" id="bipInput" class="input scan-input" placeholder="Código ex: PLH-TRAD-..." onkeydown="processarBip(event)" autocomplete="off">
          </div>

          <button class="btn btn-secondary" id="btnToggleScannerBip" onclick="alternarScannerBipagem()">
            ${scannerBipAtivo ? '⏹ Desativar Câmera' : '📷 Ativar Câmera'}
          </button>

          <div id="cameraReader" style="margin:18px auto 0;"></div>

          <div class="divider"></div>
          <div class="table-wrap" style="text-align:left;">
            <table>
              <thead>
                <tr>
                  <th>Data/Hora</th>
                  <th>Código</th>
                  <th>Tipo</th>
                </tr>
              </thead>
              <tbody id="bipagemLogBody">
                ${renderBipagemLogRows()}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderBipagemLogRows() {
      const itens = (DB.scanlog || []).slice(-15).reverse();
      if (!itens.length) return '<tr><td colspan="3" class="empty">Nenhuma bipagem registrada ainda.</td></tr>';
      return itens.map(l => {
        const badgeClass = l.tipo === 'perda' ? 'badge-danger' : (l.tipo === 'doacao' ? 'badge-warn' : 'badge-ok');
        return `
          <tr>
            <td class="mono">${fmtDateTime(l.data)}</td>
            <td class="mono">${esc(l.codigo)}</td>
            <td><span class="badge ${badgeClass}">${esc(l.tipoLabel || TIPO_BIP_LABELS[l.tipo] || l.tipo)}</span></td>
          </tr>
        `;
      }).join('');
    }

    function atualizarBipagemUI() {
      const tbody = document.getElementById('bipagemLogBody');
      if (tbody) {
        tbody.innerHTML = renderBipagemLogRows();
      }
    }

    function processarBipagemCodigo(codigoBruto) {
      const codigo = (codigoBruto || '').trim();
      if (!codigo) return;

      const achado = findItemByCode(codigo);
      if (!achado) {
        toast('Código não encontrado: ' + codigo, 'err');
        return;
      }
      const { producao, item } = achado;
      if (item.status && item.status !== 'disponivel') {
        toast('Este item já foi baixado anteriormente!', 'err');
        return;
      }
      const produto = findProduto(producao.produtoId);
      if (!produto) {
        toast('Produto não encontrado para este item', 'err');
        return;
      }

      const tipo = BIPAGEM_TIPO;
      produto.estoque = Math.max(0, produto.estoque - 1);
      item.status = tipo === 'perda' ? 'perda' : (tipo === 'doacao' ? 'doado' : 'vendido');

      if (tipo === 'venda') {
        DB.vendas.push({
          id: uid(),
          data: nowISO(),
          itens: [{ produtoId: produto.id, qty: 1, preco: produto.preco }],
          origem: 'bipagem',
          codigo
        });
      }

      DB.scanlog.push({
        id: uid(),
        data: nowISO(),
        codigo,
        produtoId: produto.id,
        tipo,
        tipoLabel: TIPO_BIP_LABELS[tipo] || tipo
      });

      persist('produtos', 'vendas', 'scanlog', 'producoes');
      atualizarBipagemUI();

      if (tipo === 'venda') {
        toast(`Venda registrada: ${produto.nome} (${fmtMoney(produto.preco)})`, 'ok');
      } else if (tipo === 'doacao') {
        toast(`Doação registrada: ${produto.nome}`, 'ok');
      } else {
        toast(`Perda/Avaria registrada: ${produto.nome}`, 'err');
      }
    }

    function processarBip(e) {
      if (e.key === 'Enter') {
        const val = e.target.value.trim();
        if (!val) return;
        processarBipagemCodigo(val);
        e.target.value = '';
      }
    }

    function alternarScannerBipagem() {
      if (scannerBipAtivo) {
        pararScannerBipagem();
      } else {
        iniciarScannerBipagem();
      }
    }

    function iniciarScannerBipagem() {
      const readerEl = document.getElementById('cameraReader');
      const btn = document.getElementById('btnToggleScannerBip');
      if (!readerEl || typeof Html5Qrcode === 'undefined') {
        toast('Leitor de QR Code não disponível neste navegador', 'err');
        return;
      }
      try {
        html5QrScannerBip = new Html5Qrcode('cameraReader');
        html5QrScannerBip.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          (decodedText) => {
            const agora = Date.now();
            if (decodedText === ultimoScanCodigo && (agora - ultimoScanTempo) < 3000) return;
            ultimoScanCodigo = decodedText;
            ultimoScanTempo = agora;
            processarBipagemCodigo(decodedText);
          },
          () => { /* ignora erros de leitura quadro a quadro */ }
        ).then(() => {
          scannerBipAtivo = true;
          if (btn) btn.textContent = '⏹ Desativar Câmera';
        }).catch((err) => {
          toast('Não foi possível acessar a câmera: ' + err, 'err');
        });
      } catch (err) {
        toast('Erro ao iniciar o leitor de QR Code', 'err');
      }
    }

    function pararScannerBipagem() {
      if (html5QrScannerBip) {
        html5QrScannerBip.stop().then(() => {
          html5QrScannerBip.clear();
        }).catch(() => {}).finally(() => {
          html5QrScannerBip = null;
          scannerBipAtivo = false;
          const btn = document.getElementById('btnToggleScannerBip');
          if (btn) btn.textContent = '📷 Ativar Câmera';
        });
      } else {
        scannerBipAtivo = false;
      }
    }

    // Módulo Etiquetas
    function gerarQrDataUrl(texto) {
      try {
        const qr = qrcode(0, 'M');
        qr.addData(String(texto));
        qr.make();
        return qr.createDataURL(6, 2);
      } catch (e) {
        console.error('Erro ao gerar QR Code', e);
        return '';
      }
    }

    function viewEtiquetas() {
      const layout = DB.etiquetaLayout || defaultEtiquetaLayout();
      const producoesComItens = DB.producoes.filter(p => (p.itens || []).length);
      const producaoSelId = window.ETQ_PRODUCAO_ID && producoesComItens.some(p => p.id === window.ETQ_PRODUCAO_ID)
        ? window.ETQ_PRODUCAO_ID
        : (producoesComItens[producoesComItens.length - 1]?.id || '');
      const prod = producoesComItens.find(p => p.id === producaoSelId);
      const p = prod ? findProduto(prod.produtoId) : null;

      const labelsHtml = prod ? (prod.itens || []).map((it, idx) => `
        <div class="label-card">
          <div class="label-eyebrow">${esc(layout.textoEyebrow || DB.config.nome)}</div>
          <div class="label-num">${idx + 1}</div>
          <div class="label-name">${esc(p ? p.nome : 'Produto')}</div>
          <div class="label-row">Validade: <b>${fmtDate(prod.dataValidade)}</b></div>
          <div class="label-qr-wrap">
            <img src="${gerarQrDataUrl(it.codigo)}" alt="QR Code">
          </div>
          <div class="label-code">${esc(it.codigo)}</div>
        </div>
      `).join('') : '';

      return `
        <div class="card card-pad">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">
            <div>
              <h3>Impressão e Gerador de Etiquetas</h3>
              <p class="hint">Selecione uma produção recente para visualizar e imprimir as etiquetas com QR Code.</p>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir Etiquetas</button>
              <button class="btn btn-primary" onclick="salvarEtiquetasPDF()">📄 Salvar como PDF</button>
            </div>
          </div>

          <div class="divider"></div>

          ${producoesComItens.length ? `
          <div class="field" style="max-width:360px;">
            <label>Lote / Produção</label>
            <select class="input" onchange="window.ETQ_PRODUCAO_ID = this.value; render();">
              ${producoesComItens.map(pr => {
                const prNome = (findProduto(pr.produtoId) || {}).nome || 'Produto';
                return `<option value="${pr.id}" ${pr.id === producaoSelId ? 'selected' : ''}>${esc(prNome)} — Lote ${esc(pr.lote)} (${(pr.itens || []).length} un.)</option>`;
              }).join('')}
            </select>
          </div>
          ` : ''}

          <div class="grid grid-4" style="margin:16px 0;">
            <div class="field">
              <label>Largura (cm)</label>
              <input type="number" step="0.1" min="1" id="etqLargura" class="input" value="${layout.larguraCm}" oninput="atualizarLayoutEtiqueta()">
            </div>
            <div class="field">
              <label>Altura (cm)</label>
              <input type="number" step="0.1" min="1" id="etqAltura" class="input" value="${layout.alturaCm}" oninput="atualizarLayoutEtiqueta()">
            </div>
            <div class="field">
              <label>Orientação</label>
              <select id="etqOrientacao" class="input" onchange="atualizarLayoutEtiqueta()">
                <option value="retrato" ${layout.orientacao !== 'paisagem' ? 'selected' : ''}>Retrato</option>
                <option value="paisagem" ${layout.orientacao === 'paisagem' ? 'selected' : ''}>Paisagem</option>
              </select>
            </div>
            <div class="field">
              <label>QR Code (px)</label>
              <input type="number" step="2" min="40" id="etqQr" class="input" value="${layout.tamanhoQr}" oninput="atualizarLayoutEtiqueta()">
            </div>
          </div>
          <div class="grid grid-3" style="margin-bottom:8px;">
            <div class="field">
              <label>Fonte Título (cm)</label>
              <input type="number" step="0.05" min="0.1" id="etqFonteTitulo" class="input" value="${layout.tamanhoTitulo}" oninput="atualizarLayoutEtiqueta()">
            </div>
            <div class="field">
              <label>Fonte Corpo (cm)</label>
              <input type="number" step="0.02" min="0.1" id="etqFonteCorpo" class="input" value="${layout.tamanhoCorpo}" oninput="atualizarLayoutEtiqueta()">
            </div>
            <div class="field">
              <label>Fonte Código (cm)</label>
              <input type="number" step="0.02" min="0.1" id="etqFonteCodigo" class="input" value="${layout.tamanhoCodigo}" oninput="atualizarLayoutEtiqueta()">
            </div>
          </div>

          <div class="divider"></div>
          <div class="labels-sheet" id="labelsSheet">
            ${labelsHtml || '<p class="empty">Nenhuma etiqueta gerada recentemente.</p>'}
          </div>
        </div>
      `;
    }

    function atualizarLayoutEtiqueta() {
      const layout = DB.etiquetaLayout || (DB.etiquetaLayout = defaultEtiquetaLayout());
      const largEl = document.getElementById('etqLargura');
      const altEl = document.getElementById('etqAltura');
      const oriEl = document.getElementById('etqOrientacao');
      const qrEl = document.getElementById('etqQr');
      const ftEl = document.getElementById('etqFonteTitulo');
      const fcEl = document.getElementById('etqFonteCorpo');
      const fcodEl = document.getElementById('etqFonteCodigo');

      if (largEl) layout.larguraCm = parseFloat(largEl.value) || layout.larguraCm;
      if (altEl) layout.alturaCm = parseFloat(altEl.value) || layout.alturaCm;
      if (oriEl) layout.orientacao = oriEl.value;
      if (qrEl) layout.tamanhoQr = parseFloat(qrEl.value) || layout.tamanhoQr;
      if (ftEl) layout.tamanhoTitulo = parseFloat(ftEl.value) || layout.tamanhoTitulo;
      if (fcEl) layout.tamanhoCorpo = parseFloat(fcEl.value) || layout.tamanhoCorpo;
      if (fcodEl) layout.tamanhoCodigo = parseFloat(fcodEl.value) || layout.tamanhoCodigo;

      aplicarLayoutEtiquetaCSS();
      persist('etiquetaLayout');
    }

    window.aplicarLayoutEtiquetaCSS = function aplicarLayoutEtiquetaCSS() {
      const layout = DB.etiquetaLayout || defaultEtiquetaLayout();
      const root = document.documentElement;
      const bruto1 = Number(layout.larguraCm) || 9;
      const bruto2 = Number(layout.alturaCm) || 6;
      const maior = Math.max(bruto1, bruto2);
      const menor = Math.min(bruto1, bruto2);
      const largura = layout.orientacao === 'paisagem' ? maior : menor;
      const altura = layout.orientacao === 'paisagem' ? menor : maior;

      root.style.setProperty('--lbl-w', largura + 'cm');
      root.style.setProperty('--lbl-min-h', altura + 'cm');
      root.style.setProperty('--lbl-size-title', (layout.tamanhoTitulo || 0.5) + 'cm');
      root.style.setProperty('--lbl-size-body', (layout.tamanhoCorpo || 0.3) + 'cm');
      root.style.setProperty('--lbl-size-code', (layout.tamanhoCodigo || 0.25) + 'cm');
      root.style.setProperty('--lbl-qr-size', (layout.tamanhoQr || 76) + 'px');
      root.style.setProperty('--etq-page-w', largura + 'cm');
      root.style.setProperty('--etq-page-h', altura + 'cm');
    };

    function salvarEtiquetasPDF() {
      document.body.classList.add('etq-export-pdf');
      toast('Na janela de impressão, selecione "Salvar como PDF" como destino.', 'ok');
      setTimeout(() => {
        window.print();
        setTimeout(() => document.body.classList.remove('etq-export-pdf'), 600);
      }, 200);
    }

    // Módulo Relatórios
    function viewRelatorios() {
      return `
        <div class="card card-pad">
          <h3>Relatório Consolidado</h3>
          <p class="hint">Estatísticas detalhadas de consumo de insumos e margem de lucro.</p>
          <div class="divider"></div>
          <p>Total de Vendas Registradas: <b>${DB.vendas.length}</b></p>
          <p>Total de Lotes Produzidos: <b>${DB.producoes.length}</b></p>
        </div>
      `;
    }

    // Módulo Configurações
    function viewConfig() {
      const cfg = DB.config;
      return `
        <div class="card card-pad">
          <h3>Configurações da Empresa</h3>
          <div class="divider"></div>
          <div class="field">
            <label>Nome Comercial</label>
            <input type="text" id="cfgNome" class="input" value="${esc(cfg.nome)}">
          </div>
          <div class="field-row">
            <div class="field">
              <label>WhatsApp</label>
              <input type="text" id="cfgWhatsapp" class="input" value="${esc(cfg.whatsapp)}">
            </div>
            <div class="field">
              <label>Instagram</label>
              <input type="text" id="cfgInstagram" class="input" value="${esc(cfg.instagram)}">
            </div>
          </div>
          <button class="btn btn-primary" onclick="salvarConfig()">Salvar Configurações</button>
        </div>
      `;
    }

    function salvarConfig() {
      DB.config.nome = document.getElementById('cfgNome').value;
      DB.config.whatsapp = document.getElementById('cfgWhatsapp').value;
      DB.config.instagram = document.getElementById('cfgInstagram').value;
      persist('config');
      toast('Configurações salvas!', 'ok');
    }

    function fecharModal(e) {
      if (e.target.classList.contains('modal-backdrop')) fecharModalDirect();
    }

    function fecharModalDirect() {
      document.getElementById('modalRoot').innerHTML = '';
    }
  </script>
</body>
</html>
